<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Focus × Rollover</title>
<style>
  :root {
    --bg: #08090c; --surface: #13151b; --fg: #eceef1; --muted: #8d939e;
    --subtle: #636874; --accent: #c5ccd6; --accent-fg: #0b0c0f;
    --border: #2a2e36; --hud: #d5dbe3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  button { font: inherit; cursor: pointer; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui .hit { pointer-events: auto; }
  .display { font-family: "Segoe UI Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  header.hud { display: flex; justify-content: space-between; gap: 12px; padding: 16px 16px 0; }
  header.hud h1 { font-size: 18px; font-weight: 600; letter-spacing: .04em; }
  .icon-btn { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); }
  #flash { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-size: 28px; letter-spacing: .18em; display: none; }
  .reticle { position: absolute; left: 50%; top: 50%; width: 112px; height: 1px; background: color-mix(in srgb, var(--hud) 35%, transparent); transform: translate(-50%, -50%); }
  #horizon { position: absolute; left: 50%; top: 58%; width: 128px; height: 1px; background: color-mix(in srgb, var(--hud) 70%, transparent); transform: translateX(-50%); transform-origin: center; }
  footer.hud { position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between; align-items: end; gap: 12px; padding: 16px 16px max(16px, env(safe-area-inset-bottom)); font-size: 11px; line-height: 1.6; color: var(--muted); }
  @media (max-width: 640px) { footer.hud { bottom: 148px; } }
  .thr { width: 160px; text-align: center; }
  .bar { height: 6px; border-radius: 999px; background: #1b1e26; overflow: hidden; margin-bottom: 4px; }
  .bar > i { display: block; height: 100%; width: 62%; background: var(--accent); }
  #panel { position: absolute; inset: 0; display: grid; place-items: end center; background: color-mix(in srgb, var(--bg) 20%, transparent); padding: 20px 20px max(24px, env(safe-area-inset-bottom)); }
  #panel[hidden] { display: none !important; }
  @media (min-width: 640px) { #panel { place-items: center; } }
  .card { width: min(100%, 440px); border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 80%, transparent); border-radius: 16px; padding: 28px 28px 24px; backdrop-filter: blur(8px); }
  .kicker { font-size: 12px; letter-spacing: .22em; color: var(--muted); font-weight: 500; }
  .card h2 { font-size: clamp(36px, 8vw, 48px); line-height: .95; font-weight: 600; margin: 6px 0 14px; }
  .card h2 span { display: block; color: var(--muted); }
  .card p.lead { color: var(--muted); font-size: 14px; line-height: 1.55; margin-bottom: 18px; }
  dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 11px; color: var(--subtle); margin-bottom: 22px; }
  dl dd { color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .go { height: 48px; padding: 0 28px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .ghost { height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); }
  #crash { position: absolute; inset: 0; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 55%, transparent); z-index: 8; }
  #crash.show { display: grid; }
  #crash .splash { text-align: center; animation: crashIn 0.45s ease-out; }
  #crash .splash h2 { font-size: clamp(40px, 10vw, 72px); line-height: .92; font-weight: 600; letter-spacing: .04em; }
  #crash .splash h2 span { display: block; color: var(--muted); }
  #crash .count { margin-top: 14px; font-size: 13px; letter-spacing: .2em; color: var(--muted); }
  @keyframes crashIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
  #touch { display: none; position: absolute; left: 12px; right: 12px; bottom: 16px; justify-content: space-between; align-items: end; }
  @media (max-width: 640px) { #touch { display: flex; } }
  #stick { width: 112px; height: 112px; border-radius: 999px; border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 80%, transparent); position: relative; }
  #knob { width: 44px; height: 44px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 80%, transparent); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .pads { display: flex; flex-direction: column; align-items: end; gap: 8px; }
  .pads-row { display: flex; gap: 8px; }
  .pad { min-width: 48px; height: 48px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font-family: ui-monospace, monospace; font-size: 12px; }
  #sun {
    position: absolute; left: 70%; top: 30%; width: min(64vw, 560px);
    transform: translate(-50%, -50%); z-index: 1; pointer-events: none;
    mix-blend-mode: soft-light; opacity: 0.16;
  }
  #sun img {
    display: block; width: 100%; height: auto;
    -webkit-mask-image: radial-gradient(ellipse 82% 78% at 50% 48%, #000 40%, rgba(0,0,0,0.25) 70%, transparent 100%);
    mask-image: radial-gradient(ellipse 82% 78% at 50% 48%, #000 40%, rgba(0,0,0,0.25) 70%, transparent 100%);
    filter: contrast(0.92) saturate(0.75) brightness(1.15);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="sun" aria-hidden="true"><img src="iii.png" alt="" /></div>
  <header class="hud" id="chrome" hidden>
    <div>
      <h1 class="display">FOCUS × ROLLOVER</h1>
      <div class="mono" id="scoreline" style="font-size:12px;color:var(--muted)"></div>
      <div class="mono" id="gateline" style="font-size:12px;color:var(--subtle)"></div>
    </div>
    <div class="hit" style="display:flex;gap:8px">
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Mute">M</button>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">II</button>
    </div>
  </header>
  <div id="flash" class="display"></div>
  <div class="reticle" id="reticle" hidden></div>
  <div id="horizon" hidden></div>
  <footer class="hud mono" id="instruments" hidden>
    <div id="leftInst"></div>
    <div class="thr"><div class="bar"><i id="thrBar"></i></div><div id="thrLabel" style="font-size:10px;letter-spacing:.16em;color:var(--subtle)"></div></div>
    <div id="rightInst" style="text-align:right"></div>
  </footer>
  <div id="crash"><div class="splash"><p class="kicker">FOCUS × ROLLOVER</p><h2 class="display">FOCUS<span>ROLLOVER</span></h2><p class="count mono">RECOVERING · <span id="crashCount">5</span></p></div></div>
  <div id="touch" class="hit">
    <div id="stick"><div id="knob"></div></div>
    <div class="pads">
      <div class="pads-row">
        <button class="pad" type="button" data-barrel="left">L</button>
        <button class="pad" type="button" data-barrel="right">R</button>
        <button class="pad" type="button" id="loopBtn">LOOP</button>
      </div>
      <div class="pads-row">
        <button class="pad" type="button" id="thrUp">+</button>
        <button class="pad" type="button" id="abBtn">AB</button>
      </div>
    </div>
  </div>
  <div id="panel" class="hit"><div class="card" id="card"></div></div>
</div>
<script>
(function () {
"use strict";

const ROLL_RATE = 2.35, PITCH_RATE = 1.15, YAW_RATE = 0.72, COORD_TURN = 1.05;
const GATE_COUNT = 36, BEST_KEY = "focus-rollover-best";
const ISLANDS = [
  { x: 30, z: -220, r: 90, h: 16 }, { x: 150, z: -480, r: 110, h: 24 },
  { x: -40, z: -700, r: 80, h: 14 }, { x: -180, z: -980, r: 130, h: 28 },
  { x: 60, z: -1280, r: 95, h: 18 }, { x: 200, z: -1620, r: 120, h: 22 },
  { x: -90, z: -1980, r: 100, h: 20 }, { x: 20, z: -2400, r: 140, h: 26 },
  { x: -160, z: -2860, r: 110, h: 19 }, { x: 110, z: -3300, r: 125, h: 23 }
];
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function wrapPi(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }

function pad(n, w) { return Math.round(n).toString().padStart(w || 3, "0"); }

  var h = 0;
  for (var i = 0; i < ISLANDS.length; i++) {
    var isl = ISLANDS[i], dx = x - isl.x, dz = z - isl.z, d2 = dx * dx + dz * dz, r2 = isl.r * isl.r;

}
function createSim() {
  return {
    x: 0, y: 48, z: 36, yaw: 0, pitch: 0, roll: 0, speed: 44, throttle: 0.62,
    alive: true, crashed: false, crashTimer: 0, maneuver: null, gForce: 5.5,
    nextGate: 0, score: 0, combo: 0, gatesHit: 0, time: 0, shake: 0,
    barrelBonusArmed: false, spawnX: 0, spawnY: 48, spawnZ: 36, spawnYaw: 0, finished: false
  };
}
function respawn(sim) {
  var gate = sim.nextGate > 0 ? gateAt(sim.nextGate - 1) : null;
  sim.x = gate ? gate.x : sim.spawnX; sim.y = gate ? gate.y + 6 : sim.spawnY; sim.z = gate ? gate.z + 28 : sim.spawnZ;
  sim.yaw = gate ? gate.yaw : sim.spawnYaw; sim.pitch = 0; sim.roll = 0; sim.speed = 42; sim.throttle = 0.62;
  sim.alive = true; sim.crashed = false; sim.crashTimer = 0; sim.maneuver = null; sim.barrelBonusArmed = false; sim.combo = 0; sim.shake = 0.2; sim.gForce = 5.5;
}
function beginManeuver(sim, kind) {
  sim.maneuver = { kind: kind, t: 0, duration: kind === "loop" ? 2.05 : 1.35, startYaw: sim.yaw, startPitch: sim.pitch, startRoll: sim.roll, startY: sim.y };
}
function stepManeuver(sim, dt) {
  var m = sim.maneuver; if (!m) return null;
  m.t += dt; var u = Math.min(m.t / m.duration, 1), e = easeInOutCubic(u);

    sim.roll = m.startRoll + e * Math.PI * 2; sim.yaw = m.startYaw + Math.sin(e * Math.PI) * 0.42;
    sim.y = m.startY + Math.sin(e * Math.PI) * 7; sim.pitch = m.startPitch * (1 - Math.sin(e * Math.PI) * 0.35);
  } else if (m.kind === "barrel-right") {

    sim.y = m.startY + Math.sin(e * Math.PI) * 7; sim.pitch = m.startPitch * (1 - Math.sin(e * Math.PI) * 0.35);
  } else { sim.pitch = m.startPitch + e * Math.PI * 2; sim.roll = m.startRoll * (1 - e); }

  else if (m.kind === "barrel-right") { sim.roll = wrapPi(m.startRoll); sim.yaw = m.startYaw - 0.18; sim.pitch = m.startPitch; sim.barrelBonusArmed = true; }

function stepSim(sim, input, dt) {

    var kind2 = input.startBarrel === "left" ? "barrel-left" : "barrel-right";

  } else if (!sim.maneuver && input.startLoop) { beginManeuver(sim, "loop"); events.push({ type: "maneuver-start", kind: "loop" }); }

    sim.roll += input.roll * ROLL_RATE * dt; sim.pitch += input.pitch * PITCH_RATE * dt; sim.yaw += input.yaw * YAW_RATE * dt;
    if (Math.abs(input.roll) < 0.08) sim.roll *= Math.exp(-0.7 * dt);
    sim.pitch = clamp(sim.pitch, -1.15, 1.15);
    if (Math.abs(sim.roll) > 1.45) sim.roll = clamp(sim.roll, -1.55, 1.55);
    sim.yaw += Math.sin(sim.roll) * COORD_TURN * clamp(sim.speed / 48, 0.35, 1.35) * dt;
  }
  sim.throttle = clamp(sim.throttle + input.throttleDelta * 0.55 * dt, 0.1, 1);
  var target = MIN_SPEED + sim.throttle * (MAX_SPEED - MIN_SPEED) + (input.boost ? 26 : 0);
  sim.speed += (target - sim.speed) * (1 - Math.exp(-1.7 * dt));
  sim.speed += -Math.sin(sim.pitch) * 14 * dt;
  if (sim.speed < 22 && sim.pitch > 0.12) sim.pitch -= 0.85 * dt * (1 - sim.speed / 22);
  sim.speed = clamp(sim.speed, 8, 128);
  var fx = -Math.sin(sim.yaw) * Math.cos(sim.pitch), fy = Math.sin(sim.pitch), fz = -Math.cos(sim.yaw) * Math.cos(sim.pitch);
  sim.x += fx * sim.speed * dt; sim.y += fy * sim.speed * dt; sim.z += fz * sim.speed * dt;
  var load = 5.35 + Math.abs(sim.roll) * 0.28 + Math.abs(sim.pitch) * 0.22 + (input.boost ? 0.35 : 0);
  sim.gForce += (clamp(load, 5.2, 6) - sim.gForce) * (1 - Math.exp(-6 * dt));
  var floor = Math.max(1.8, terrainHeight(sim.x, sim.z) + 2.4);
  if (sim.y < floor || sim.y > 240) {
    sim.alive = false; sim.crashed = true; sim.crashTimer = 0; sim.shake = 1; sim.speed = 0; sim.combo = 0;
    events.push({ type: "crash" }); return events;
  }
  var gate = sim.nextGate < GATE_COUNT ? gateAt(sim.nextGate) : null;
  if (gate) {
    var dx = sim.x - gate.x, dy = sim.y - gate.y, dz = sim.z - gate.z, dist = Math.hypot(dx, dy, dz);

  }

}
var held = new Set();
var touchRoll = 0, touchPitch = 0, touchThrottle = 0, touchBoost = false;
var queuedBarrel = null, queuedLoop = false, queuedCancel = false;
window.addEventListener("keydown", function (e) {
  held.add(e.code);
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown" || e.code === "ArrowLeft" || e.code === "ArrowRight") e.preventDefault();
});
window.addEventListener("keyup", function (e) { held.delete(e.code); });
window.addEventListener("blur", function () { held.clear(); });
function readInput() {
  var roll = 0, pitch = 0, yaw = 0, throttleDelta = touchThrottle;
  if (held.has("KeyA") || held.has("ArrowLeft")) roll += 1;
  if (held.has("KeyD") || held.has("ArrowRight")) roll -= 1;
  if (held.has("KeyW") || held.has("ArrowUp")) pitch += 1;
  if (held.has("KeyS") || held.has("ArrowDown")) pitch -= 1;
  if (held.has("KeyQ")) yaw += 1;
  if (held.has("KeyE")) yaw -= 1;
  if (held.has("ShiftLeft") || held.has("ShiftRight") || held.has("KeyR")) throttleDelta += 1;
  if (held.has("ControlLeft") || held.has("ControlRight") || held.has("KeyF") || held.has("KeyZ")) throttleDelta -= 1;
  var startBarrel = queuedBarrel; queuedBarrel = null;
  if (!startBarrel && held.has("Digit1")) startBarrel = "left";
  if (!startBarrel && held.has("Digit2")) startBarrel = "right";
  var startLoop = queuedLoop || held.has("Digit3"); queuedLoop = false;
  var cancelManeuver = queuedCancel; queuedCancel = false;
  return {
    roll: clamp(roll + touchRoll, -1, 1), pitch: clamp(pitch + touchPitch, -1, 1),
    yaw: clamp(yaw, -1, 1), throttleDelta: clamp(throttleDelta, -1, 1),
    boost: touchBoost || held.has("Space"), startBarrel: startBarrel, startLoop: startLoop, cancelManeuver: cancelManeuver
  };
}
var audio = {
  ctx: null, master: null, osc: null, filter: null, engine: null, noise: null, muted: false,

};
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d", { alpha: false });
var W = 1, H = 1, FOC = 1;
function baseFoc() { return (H * 0.5) / Math.tan((62 * Math.PI / 180) / 2); }

  if (phase === "playing" || phase === "crash") { panel.hidden = true; return; }
  panel.hidden = false;
  if (phase === "start") {
    card.innerHTML = '<p class="kicker">AEROBATIC COURSE</p><h2 class="display">FOCUS<span>ROLLOVER</span></h2><p class="lead">A destroyer holds station on the water under the jet. Visual only — it never steers the camera.</p><dl class="mono"><dt>W / S</dt><dd>Pitch up / down</dd><dt>A / D</dt><dd>Roll left / right</dd><dt>SHIFT / F</dt><dd>Throttle</dd><dt>SPACE</dt><dd>Afterburner</dd><dt>1 / 2 / 3</dt><dd>Left roll · Right roll · Loop</dd></dl><div class="row"><span class="mono" style="font-size:12px;color:var(--subtle)">BEST ' + best + '</span><button class="go" id="takeoff" type="button">Take off</button></div>';
    $("takeoff").onclick = takeOff;
  } else if (phase === "paused") {
    card.innerHTML = '<h2 class="display" style="font-size:32px;margin-bottom:8px">Paused</h2><p class="mono" style="color:var(--muted);font-size:12px;margin-bottom:20px">SCORE ' + sim.score + " · GATE " + Math.min(sim.nextGate + 1, GATE_COUNT) + "/" + GATE_COUNT + '</p><div class="row" style="justify-content:flex-start;gap:8px"><button class="go" id="resume" type="button">Resume</button><button class="ghost" id="hangar" type="button">Hangar</button></div>';
    $("resume").onclick = function () { setPhase("playing"); };
    $("hangar").onclick = function () { sim = createSim(); resetShip(); pitReady = false; setPhase("start"); };
  } else if (phase === "finish") {
    card.innerHTML = '<p class="kicker">COURSE COMPLETE</p><h2 class="display" style="font-size:32px">On the deck</h2><p class="mono" style="color:var(--muted);margin:12px 0 20px">SCORE ' + lastScore + " · BEST " + best + '</p><div class="row" style="justify-content:flex-start;gap:8px"><button class="go" id="again" type="button">Fly again</button><button class="ghost" id="hangar2" type="button">Hangar</button></div>';
    $("again").onclick = takeOff;
    $("hangar2").onclick = function () { sim = createSim(); resetShip(); pitReady = false; setPhase("start"); };
  }
}
function setPhase(next) {
  phase = next;
  $("chrome").hidden = next === "start";
  $("instruments").hidden = next === "start";
  $("reticle").hidden = next === "start";
  $("horizon").hidden = next === "start";
  if (next === "crash") {
    var el = $("crash");
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
    $("crashCount").textContent = "5";
  } else {
    $("crash").classList.remove("show");
  }
  $("pauseBtn").style.display = next === "playing" ? "grid" : "none";
  renderCard();
}
function takeOff() {
  audio.unlock();
  sim = createSim();
  pitReady = false;
  $("panel").hidden = true;
  setPhase("playing");
}
function updateHud(input) {
  $("scoreline").textContent = "SCORE " + pad(sim.score, 5) + " · BEST " + pad(best, 5);
  $("gateline").textContent = "GATE " + Math.min(sim.nextGate + 1, GATE_COUNT) + "/" + GATE_COUNT + (sim.combo > 1 ? " · COMBO ×" + sim.combo : "");
  $("leftInst").innerHTML = "IAS " + pad(sim.speed * 8) + "<br>ALT " + pad(sim.y) + "<br>HDG " + pad(headingDeg(sim.yaw));
  var g = sim.nextGate < GATE_COUNT ? gateAt(sim.nextGate) : null;
  var dist = g ? Math.hypot(sim.x - g.x, sim.y - g.y, sim.z - g.z) : 0;
  $("rightInst").innerHTML = "G " + sim.gForce.toFixed(1) + "<br>NXT " + pad(dist) + '<br><span style="color:var(--subtle)">1 / 2 ROLL</span>';
  $("thrBar").style.width = Math.round(sim.throttle * 100) + "%";
  $("thrLabel").textContent = (input.boost && phase === "playing" ? "AB " : "THR ") + Math.round(sim.throttle * 100) + (sim.maneuver ? " · " + sim.maneuver.kind.replace("-", " ").toUpperCase() : "");
  $("horizon").style.transform = "translateX(-50%) rotate(" + (clamp(sim.roll / 1.2, -1, 1) * -28) + "deg)";
}
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  FOC = baseFoc();
}
addEventListener("resize", resize); resize();
canvas.addEventListener("click", function (e) {
  var now = performance.now();
  var dbl = now - (canvas._lastTap || 0) < 320;
  canvas._lastTap = now;
  if (phase !== "playing") return;
  if (sim.maneuver) { queuedCancel = true; return; }
  if (!dbl) return;
  queuedBarrel = e.clientX < W / 2 ? "left" : "right";
});
canvas.addEventListener("dblclick", function (e) {
  e.preventDefault();
  if (phase !== "playing") return;
  if (sim.maneuver) { queuedCancel = true; return; }
  queuedBarrel = e.clientX < W / 2 ? "left" : "right";
});
$("muteBtn").onclick = function () { audio.unlock(); audio.setMuted(!audio.muted); $("muteBtn").textContent = audio.muted ? "X" : "M"; };
$("pauseBtn").onclick = function () { if (phase === "playing") setPhase("paused"); };
addEventListener("keydown", function (e) {
  if (e.code !== "Escape") return;
  if (phase === "playing") setPhase("paused");
  else if (phase === "paused") setPhase("playing");
});
var barrelBtns = document.querySelectorAll("[data-barrel]");
for (var bi = 0; bi < barrelBtns.length; bi++) {
  (function (btn) {
    btn.addEventListener("pointerdown", function () { queuedBarrel = btn.getAttribute("data-barrel"); });
  })(barrelBtns[bi]);
}
$("loopBtn").onpointerdown = function () { queuedLoop = true; };
$("thrUp").onpointerdown = function () { touchThrottle = 1; };
$("thrUp").onpointerup = $("thrUp").onpointerleave = function () { touchThrottle = 0; };
$("abBtn").onpointerdown = function () { touchBoost = true; };
$("abBtn").onpointerup = $("abBtn").onpointerleave = function () { touchBoost = false; };
var stick = $("stick"), knob = $("knob");
function onStick(x, y) {
  var r = stick.getBoundingClientRect();
  var nx = clamp(((x - r.left) / r.width) * 2 - 1, -1, 1);
  var ny = clamp(((y - r.top) / r.height) * 2 - 1, -1, 1);
  touchRoll = -nx; touchPitch = -ny;
  knob.style.transform = "translate(calc(-50% + " + (nx * 22) + "px), calc(-50% + " + (ny * 22) + "px))";
}
stick.addEventListener("pointerdown", function (e) { stick.setPointerCapture(e.pointerId); onStick(e.clientX, e.clientY); });
stick.addEventListener("pointermove", function (e) { if (stick.hasPointerCapture(e.pointerId)) onStick(e.clientX, e.clientY); });
function endStick() { touchRoll = 0; touchPitch = 0; knob.style.transform = "translate(-50%,-50%)"; }
stick.addEventListener("pointerup", endStick);
stick.addEventListener("pointercancel", endStick);
setPhase("start");
function frame() {
  var now = performance.now();
  var dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  var input = readInput();
  if (phase === "playing" || phase === "crash") {
    acc += dt;
    while (acc >= STEP) {
      var events = stepSim(sim, input, STEP);
      for (var i = 0; i < events.length; i++) {
        var ev = events[i];
        if (ev.type === "gate") { audio.gate(ev.bonus); setFlash(ev.bonus ? "ROLL GATE ×2" : "GATE"); }
        else if (ev.type === "maneuver-start") audio.whoosh();
        else if (ev.type === "crash") { audio.crash(); commitScore(sim.score); setPhase("crash"); }
        else if (ev.type === "finish") { commitScore(sim.score); setPhase("finish"); }
      }
      acc -= STEP;
    }
  } else acc = 0;
  if (phase === "crash") $("crashCount").textContent = String(Math.max(0, Math.ceil(5 - sim.crashTimer)));
  if (phase === "crash" && sim.crashed && sim.crashTimer > 5) { respawn(sim); pitReady = false; setPhase("playing"); }
  computeJetBasis(sim);
  var follow = phase === "playing" || phase === "paused" || phase === "crash";
  FOC = baseFoc();
  if (follow) {
    var px = sim.x - jetF.x * 13.5 + jetU.x * 3.6;
    var py = sim.y - jetF.y * 13.5 + jetU.y * 3.6;
    var pz = sim.z - jetF.z * 13.5 + jetU.z * 3.6;
    if (sim.shake > 0) {
      var s = sim.shake * sim.shake;
      px += (Math.random() - 0.5) * s * 0.55;
      py += (Math.random() - 0.5) * s * 0.35;
      sim.shake = Math.max(0, sim.shake - dt * 1.7);
    }
    setCam(px, py, pz, sim.x + jetF.x * 12 + jetU.x * 0.6, sim.y + jetF.y * 12 + jetU.y * 0.6, sim.z + jetF.z * 12 + jetU.z * 0.6);
  } else {
    setCam(16, 57, 54, 0, 48, 8);
  }
  stepShip(dt);
  if (sim.alive && phase === "playing") {
    for (var i = trail.length - 1; i > 0; i--) trail[i] = trail[i - 1];
    trail[0] = { x: sim.x - jetF.x * 1.4, y: sim.y - jetF.y * 1.4, z: sim.z - jetF.z * 1.4 };
  }
  drawSky();
  drawWater();
  drawShip();
  var drawables = [];
  for (var i = 0; i < ISLANDS.length; i++) {
    var isl = ISLANDS[i];
    var d = (isl.x - cam.x) * cam.fx + (0 - cam.y) * cam.fy + (isl.z - cam.z) * cam.fz;
    if (d > 2) drawables.push({ z: d, kind: "island", isl: isl });
  }
  for (var i = 0; i < GATE_COUNT; i++) {
    var g = gateAt(i);
    var d = (g.x - cam.x) * cam.fx + (g.y - cam.y) * cam.fy + (g.z - cam.z) * cam.fz;
    if (d > 2) drawables.push({ z: d, kind: "gate", g: g, active: i === sim.nextGate });
  }
  drawables.sort(function (a, b) { return b.z - a.z; });
  for (var i = 0; i < drawables.length; i++) {
    if (drawables[i].kind === "island") drawIsland(drawables[i].isl);
    else drawGate(drawables[i].g, drawables[i].active);
  }
  drawTrail();
  if (follow) {
    if (sim.alive) {
      drawCockpitOnJet(sim, dt);
      drawJet(sim, input.boost && phase === "playing");
    } else pitReady = false;
  } else {
    var pose = { x: 0, y: 48, z: 18, yaw: 0.42, pitch: 0.1, roll: 0.14, throttle: 0.62, gForce: 5.5, alive: true };
    computeJetBasis(pose);
    drawCockpitOnJet(pose, dt);
    drawJet(pose, false);
  }
  audio.setEngine(sim.throttle, sim.speed, input.boost && phase === "playing");
  if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0) $("flash").style.display = "none"; }
  if (phase !== "start") updateHud(input);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
