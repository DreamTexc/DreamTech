<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamJump Portal</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: blob: data:; script-src 'self' 'nonce-abc123'; style-src 'self' 'nonce-abc123'; media-src blob:;">
  <style nonce="abc123">
    body { font-family: Arial, sans-serif; background: #111; color: #eee; }
    .container { width: 95%; margin: auto; padding: 20px; }
    .option { margin: 12px 0; }
    .image-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .image-container img, .download-image { width: 140px; height: 100px; object-fit: cover; border: 2px solid #444; border-radius: 6px; }
    .message { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 20px; border-radius: 5px; display: none; z-index: 999; }
    .icmi-overlay { position: relative; width: 380px; display: inline-block; vertical-align: top; margin-left: 20px; }
    .icmi-code { position: absolute; top: 16px; left: 20px; width: 340px; background: rgba(0,0,0,.7); color: #00ffea; padding: 8px; font: 13px "Courier New", monospace; border-radius: 4px; white-space: pre-wrap; }
    .parallelogram { transform: skew(-15deg); background: #fff; color: #000; border: 2px solid #000; padding: 16px; display: inline-block; margin-top: 16px; }
    .parallelogram-content { transform: skew(15deg); }
    .bottom-chart {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .demo-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
      max-width: 480px;
    }
    .demo-strip img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
    }
    .search-panel { border: 1px solid #444; padding: 12px; margin: 12px 0; background: #1a1a1a; max-width: 420px; display: inline-block; vertical-align: top; }
    #videoPreview { max-width: 640px; margin-top: 12px; display: none; }
    #downloadLink { display: none; margin: 10px; color: #00ffea; }
    button { background: #222; color: #00ffea; border: 1px solid #00ffea; padding: 6px 12px; cursor: pointer; }
    input { background: #222; color: #fff; border: 1px solid #555; padding: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>DreamJump Portal</h1>

    <div class="icmi-overlay">
      <img src="too.png" class="icmi-base" alt="ICMI" style="width:100%">
      <div class="icmi-code" id="icmiTerminal"><pre>ICMI TERMINAL ONLINE
--------------------
Awaiting RELOOP commands...</pre></div>
    </div>

    <div class="option">
      <a href="https://raw.githubusercontent.com/DreamTexc/DreamTech/refs/heads/main/example.txt" download>
        <img src="https://i.pinimg.com/originals/68/29/54/6829547452ad4bb70f4770fc404a17ac.jpg" alt="SpongeBob-style" class="download-image">
      </a>
    </div>

    <div class="search-panel">
      <strong>Google Image Search</strong><br>
      <input type="text" id="googleQuery" placeholder="search jets, aircraft, etc." style="width:70%">
      <button id="googleSearchBtn" nonce="abc123">Search Images</button>
      <div style="font-size:12px; margin-top:6px; color:#aaa;">
        Opens real Google Images in a new tab. Paste URLs below to add demos.
      </div>
    </div>

    <div class="option">
      <input type="text" id="urlPaste" placeholder="paste image URL then press Enter" style="width:280px">
    </div>

    <div class="option">
      <label>Seconds per photo: <input type="number" id="secondsPer" value="5" min="1" max="30" style="width:60px"></label>
      <label style="margin-left:12px;">Pan/Zoom intensity: <input type="range" id="panZoom" min="0" max="100" value="30"></label>
      <button id="immerseBtn" nonce="abc123">Immerse (Fullscreen)</button>
    </div>

    <div class="option">
      <button id="sequenceBtn" nonce="abc123">Load & Sequence Demos → Video</button>
    </div>

    <div class="option" style="border-top:1px solid #444; padding-top:12px; margin-top:20px;">
      <label for="sshKeyInput">SSH Key (Randomart only):</label><br>
      <input type="text" id="sshKeyInput" placeholder="ssh-ed25519 AAAA..." style="width:360px">
      <button id="randomartOnlyBtn" nonce="abc123">Generate Randomart (separate)</button>
    </div>

    <!-- Bottom chart line: demos next to white polygram -->
    <div class="bottom-chart">
      <div class="demo-strip" id="demoStrip"></div>
      <div class="parallelogram">
        <pre class="parallelogram-content" id="randomartOutput"></pre>
      </div>
    </div>

    <video id="videoPreview" controls></video>
    <a id="downloadLink" download="dreamjump-sequence.webm">Download Sequence Video</a>

    <div id="message" class="message"></div>
  </div>

  <script nonce="abc123">
    function icmiLog(text) {
      document.getElementById("icmiTerminal").innerHTML = "<pre>" + text + "</pre>";
    }

    const demoStore = [];

    document.getElementById("urlPaste").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const url = e.target.value.trim();
        if (url) { addDemoImage(url); e.target.value = ""; }
      }
    });

    function addDemoImage(src) {
      const img = document.createElement("img");
      img.src = src;
      img.crossOrigin = "anonymous";
      img.title = "Click to remove";
      img.addEventListener("click", () => {
        img.remove();
        const idx = demoStore.findIndex(d => d.element === img);
        if (idx !== -1) demoStore.splice(idx, 1);
        icmiLog("DEMO REMOVED\nTotal: " + demoStore.length);
      });
      document.getElementById("demoStrip").appendChild(img);
      demoStore.push({ url: src, element: img });
      icmiLog("DEMO +1\nTotal frames: " + demoStore.length);
    }

    document.getElementById("googleSearchBtn").addEventListener("click", () => {
      const q = document.getElementById("googleQuery").value.trim() || "fighter jets";
      const url = "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(q);
      window.open(url, "_blank");
      icmiLog("GOOGLE IMAGES OPENED\nQuery: " + q + "\nPaste URLs to add demos");
    });

    document.getElementById("sequenceBtn").addEventListener("click", generateSequence);

    function generateSequence() {
      if (demoStore.length === 0) {
        showMessage("No demo images selected");
        icmiLog("ERROR: No images in demo strip");
        return;
      }
      const seconds = parseFloat(document.getElementById("secondsPer").value) || 5;
      const panZoom = parseInt(document.getElementById("panZoom").value) / 100;
      startVideoChannel(demoStore.map(f => f.element), seconds, panZoom);
    }

    function startVideoChannel(imgElements, secondsPer, panZoomIntensity) {
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext("2d");
      const fps = 15;
      const framesPerImage = Math.round(secondsPer * fps);
      const totalFrames = imgElements.length * framesPerImage;

      const stream = canvas.captureStream(fps);
      const recorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const vid = document.getElementById("videoPreview");
        vid.src = url;
        vid.style.display = "block";
        const link = document.getElementById("downloadLink");
        link.href = url;
        link.style.display = "inline";
        icmiLog("SEQUENCE COMPLETE\n" + imgElements.length + " photos × " + secondsPer + "s");
        showMessage("Sequence ready");
      };

      recorder.start();
      let frame = 0;
      const timer = setInterval(() => {
        if (frame >= totalFrames) {
          clearInterval(timer);
          recorder.stop();
          return;
        }
        const imgIndex = Math.floor(frame / framesPerImage);
        const local = (frame % framesPerImage) / framesPerImage;
        const img = imgElements[imgIndex];

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const scale = 1 + local * panZoomIntensity * 0.15;
        const w = canvas.width * scale;
        const h = canvas.height * scale;
        const x = (canvas.width - w) / 2 + Math.sin(local * Math.PI) * panZoomIntensity * 30;
        const y = (canvas.height - h) / 2 + Math.cos(local * Math.PI) * panZoomIntensity * 20;

        ctx.globalAlpha = 0.4 + local * 0.6;
        try { ctx.drawImage(img, x, y, w, h); } catch(e) {}
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#00ffea";
        ctx.font = "16px Courier New";
        ctx.fillText("Photo " + (imgIndex + 1) + " / " + imgElements.length, 16, 28);
        ctx.fillText((local * secondsPer).toFixed(1) + "s", 16, canvas.height - 16);

        frame++;
      }, 1000 / fps);

      icmiLog("ACT VIDEO CHANNEL ACTIVE\n" + imgElements.length + " frames\n" + secondsPer + "s each");
    }

    document.getElementById("immerseBtn").addEventListener("click", () => {
      const vid = document.getElementById("videoPreview");
      if (vid.requestFullscreen) vid.requestFullscreen();
      else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();
    });

    document.getElementById("randomartOnlyBtn").addEventListener("click", () => {
      const key = document.getElementById("sshKeyInput").value.trim() || "default";
      let art = "+--[ Randomart ]--+\n";
      const chars = " .:-=+*#%@";
      for (let y = 0; y < 9; y++) {
        art += "|";
        for (let x = 0; x < 17; x++) {
          const idx = (key.charCodeAt((x + y * 3) % key.length) + x * 5 + y * 11) % chars.length;
          art += chars[idx];
        }
        art += "|\n";
      }
      art += "+------------------+\n";
      document.getElementById("randomartOutput").textContent = art;
      icmiLog("RANDOMART GENERATED\n(separate from video channel)");
    });

    function showMessage(msg) {
      const box = document.getElementById("message");
      box.textContent = msg;
      box.style.display = "block";
      setTimeout(() => box.style.display = "none", 3000);
    }
  </script>
</body>
</html>
