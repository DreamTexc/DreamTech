<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Architecture with Math Overlay</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            text-align: center;
            background: url("https://images.unsplash.com/photo-1508614589041-5a9c4a0f7c52?auto=format&fit=crop&w=1600&q=80")
                repeat-x;
            background-size: cover;
            animation: parallaxScroll 20s linear infinite;
        }

        @keyframes parallaxScroll {
            from { background-position: 0 0; }
            to { background-position: -2000px 0; }
        }

        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .pointer {
            cursor: pointer;
            text-decoration: underline;
            color: #00aaff;
            font-size: 20px;
        }

        .pointer:hover {
            color: #0088cc;
        }

        .jet {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 300px;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            transition: transform 0.05s linear;
            cursor: grab;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
            opacity: 1;
            transition: opacity 0.8s ease;
            z-index: 20;
        }
    </style>
</head>

<body>

    <div id="ui">
        <span class="pointer" id="moduleRef">Module Reference</span>
        <span style="margin: 0 20px; color: #00aaff;">|</span>
        <span class="pointer" id="dollarLink">View Dollar</span>
    </div>

    <img id="jet" class="jet"
        src="https://th.bing.com/th/id/OIP.9FP89-HLK-BYghgyHBsoowAAAA?w=298&h=200&c=7&r=0&o=5&dpr=1.5&pid=1.7">

    <div class="overlay" id="mathOverlay">
        $$\lim_{{x \to a}} (bx + c) = ba + c$$
    </div>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script>
        // Hide math overlay after load
        window.onload = () => {
            setTimeout(() => {
                document.getElementById("mathOverlay").style.opacity = "0";
            }, 1500);
        };

        // === FULL 4-WAY FLIGHT SYSTEM ===
        const jet = document.getElementById("jet");

        let jetX = window.innerWidth / 2;
        let jetY = window.innerHeight / 2;

        let pitch = 0;   // nose up/down
        let bank = 0;    // left/right tilt

        let dragging = false;

        jet.addEventListener("mousedown", () => dragging = true);
        window.addEventListener("mouseup", () => dragging = false);

        window.addEventListener("mousemove", (e) => {
            if (!dragging) return;

            // Move jet toward cursor smoothly
            jetX += (e.clientX - jetX) * 0.15;
            jetY += (e.clientY - jetY) * 0.15;

            // Pitch: nose up/down
            pitch = (window.innerHeight / 2 - e.clientY) / 40;

            // Bank: left/right roll
            bank = (window.innerWidth / 2 - e.clientX) / 60;
        });

        function animateJet() {
            jet.style.left = jetX + "px";
            jet.style.top = jetY + "px";

            jet.style.transform =
                `translate(-50%, -50%) rotate(${bank}deg) rotateX(${pitch}deg)`;

            requestAnimationFrame(animateJet);
        }

        animateJet();

        // Redirect to rendered Dollar page
        document.getElementById("dollarLink").onclick = () => {
            window.location.href =
                "https://htmlpreview.github.io/?https://github.com/DreamTexc/DreamTech/blob/main/dollar.html";
        };

        // Module Reference popup
        document.getElementById("moduleRef").onclick = () => {
            alert("Module Reference Loaded!");
        };
    </script>

</body>
</html>
