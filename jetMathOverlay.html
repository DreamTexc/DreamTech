<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Enhanced jetMathOverlay – deeper skyline + mobile control</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    background-color: #0a0a12;
    color: #eee;
    user-select: none;
    -webkit-user-select: none;
    perspective: 1200px;
    position: relative;          /* needed for the overlay */
}

/* Lightened background layer */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("https://raw.githubusercontent.com/DreamTexc/DreamTech/main/pop.png")
                center center / cover no-repeat fixed;
    /* noticeably lighter */
    filter: brightness(1.48) contrast(1.08) saturate(1.12);
    z-index: -1;
    pointer-events: none;
}


        #ui {
            position: absolute;
            top: 16px;
            width: 100%;
            text-align: center;
            z-index: 30;
            pointer-events: none;
        }

        .pointer {
            pointer-events: auto;
            cursor: pointer;
            text-decoration: underline;
            color: #00aaff;
            font-size: 18px;
            margin: 0 12px;
        }
        .pointer:hover { color: #66ccff; }

/* ===== DEEPER BLACK JET (now more colorful) ===== */
#jet {
    position: absolute;
    left: 50%;
    top: 22%;
    width: 280px;
    max-width: 70vw;
    transform: translate(-50%, -50%) scale(0.42) rotateX(18deg);
    transform-style: preserve-3d;
    transform-origin: 50% 50%;
    transition: transform 0.55s cubic-bezier(0.25, 0.8, 0.25, 1),
                top 0.9s cubic-bezier(0.25, 0.8, 0.25, 1),
                left 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
    cursor: grab;
    z-index: 10;
    will-change: transform, top, left;

    /* more colorful + still has depth */
    filter: 
        contrast(1.35) 
        brightness(0.85) 
        saturate(1.45)               /* ← main color boost */
        drop-shadow(0 16px 24px rgba(0,0,0,0.75))
        blur(0.4px);
    mix-blend-mode: multiply;
    opacity: 0.95;
}

/* when it comes closer */
#jet.closer {
    filter: 
        contrast(1.35) 
        brightness(0.92) 
        saturate(1.55)               /* even richer when closer */
        drop-shadow(0 12px 18px rgba(0,0,0,0.7));
    opacity: 1;
}

        /* Landing state – still respects the deeper start */
        #jet.landing {
            top: 78% !important;
            transform: translate(-50%, -50%) rotate(0deg) rotateX(6deg) scale(0.88) !important;
        }

        /* Math overlay */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.88);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 17px;
            opacity: 1;
            transition: opacity 0.8s ease;
            z-index: 20;
            pointer-events: none;
        }

        /* Blink indicators */
        #blinkLeft, #blinkRight {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #ff2222;
            opacity: 0;
            transition: opacity 0.18s ease;
            z-index: 40;
            border-radius: 4px;
        }
        #blinkLeft  { left: 0;  top: 50%; transform: translateY(-50%); }
        #blinkRight { right: 0; top: 50%; transform: translateY(-50%); }

        /* DOM MODULE */
        #popModule {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.78);
            color: #ffcc00;
            padding: 9px 20px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            z-index: 50;
            border: 1px solid rgba(255, 204, 0, 0.45);
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* Landing hint */
        #landingHint {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-family: monospace;
            z-index: 25;
            opacity: 0.6;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        #landingHint.active {
            opacity: 1;
            color: #4cff4c;
        }

        /* Mobile button */
        #spaceBtn {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            background: rgba(255, 42, 42, 0.85);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            z-index: 40;
            display: none;
            cursor: pointer;
        }
        @media (hover: none) and (pointer: coarse) {
            #spaceBtn { display: block; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <span class="pointer" id="moduleRef">Module Reference</span>
        <span class="pointer" id="dollarLink">View Dollar</span>
    </div>

    <img id="jet"
         src="https://th.bing.com/th/id/OIP.9FP89-HLK-BYghgyHBsoowAAAA?w=298&h=200&c=7&r=0&o=5&dpr=1.5&pid=1.7"
         alt="Jet"
         draggable="false">

    <div class="overlay" id="mathOverlay">
        $$\lim_{{x \to a}} (bx + c) = ba + c$$
    </div>

    <div id="blinkLeft"></div>
    <div id="blinkRight"></div>

    <div id="popModule">DOM Module → focused on "pop.png"</div>

    <div id="landingHint">SPACE / HOLD → Attempt Landing on pop.png strip</div>

    <button id="spaceBtn">HOLD TO LAND</button>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script>
        window.onload = () => {
            setTimeout(() => {
                document.getElementById("mathOverlay").style.opacity = "0";
            }, 1600);
        };

        const jet = document.getElementById("jet");
        const landingHint = document.getElementById("landingHint");
        const spaceBtn = document.getElementById("spaceBtn");

        // Start deeper in the sky
        let jetX = window.innerWidth / 2;
        let jetY = window.innerHeight * 0.22;   // higher = deeper
        let pitch = 18;                         // stronger initial pitch for depth
        let bank = 0;
        let depth = 0.42;                       // Stevens-inspired scale (starts far)
        let targetDepth = 0.42;
        let dragging = false;
        let isLanding = false;
        let scrollAccum = 0;                    // for middle-only drop/scroll feel

        // DOM Module
        const popModule = {
            name: "pop.png",
            element: document.getElementById("popModule"),
            src: "https://raw.githubusercontent.com/DreamTexc/DreamTech/main/pop.png",
            init() {
                this.element.textContent = `DOM Module → focused on "${this.name}"`;
            },
            setFocus(name = "pop.png") {
                this.name = name;
                this.element.textContent = `DOM Module → focused on "${this.name}"`;
            }
        };
        popModule.init();
        window.popModule = popModule;

        // Landing
        function startLanding() {
            if (isLanding) return;
            isLanding = true;
            jet.classList.add("landing");
            landingHint.classList.add("active");
            landingHint.textContent = "LANDING… aligning with pop.png strip";
        }
        function abortLanding() {
            isLanding = false;
            jet.classList.remove("landing");
            landingHint.classList.remove("active");
            landingHint.textContent = "SPACE / HOLD → Attempt Landing on pop.png strip";
            // return to deepened position
            jetY = window.innerHeight * 0.22;
            targetDepth = 0.42;
            pitch = 18;
        }

        window.addEventListener("keydown", e => {
            if (e.code === "Space") { e.preventDefault(); startLanding(); }
        });
        window.addEventListener("keyup", e => {
            if (e.code === "Space") abortLanding();
        });

        spaceBtn.addEventListener("touchstart", e => { e.preventDefault(); startLanding(); });
        spaceBtn.addEventListener("touchend", e => { e.preventDefault(); abortLanding(); });
        spaceBtn.addEventListener("mousedown", startLanding);
        spaceBtn.addEventListener("mouseup", abortLanding);
        spaceBtn.addEventListener("mouseleave", abortLanding);

        // ---------- DESKTOP + MOBILE UNIFIED CONTROL ----------
        function startDrag(clientX, clientY) {
            if (isLanding) return;
            dragging = true;
            jet.classList.add("closer");
            // start bringing it closer (drop effect focused on middle)
            targetDepth = Math.min(1.05, targetDepth + 0.12);
        }

        function moveDrag(clientX, clientY) {
            if (!dragging || isLanding) return;

            // smooth follow (same feel on mobile & desktop)
            jetX += (clientX - jetX) * 0.22;
            jetY += (clientY - jetY) * 0.22;

            // pitch & bank from screen center (identical for touch & mouse)
            pitch = (window.innerHeight / 2 - clientY) / 38;
            bank  = (window.innerWidth  / 2 - clientX) / 65;

            // slight extra “drop” into the middle as you pull it
            targetDepth = Math.min(1.08, 0.55 + (clientY / window.innerHeight) * 0.55);
        }

        function endDrag() {
            dragging = false;
        }

        // Mouse
        jet.addEventListener("mousedown", e => {
            e.preventDefault();
            startDrag(e.clientX, e.clientY);
        });
        window.addEventListener("mouseup", endDrag);
        window.addEventListener("mousemove", e => moveDrag(e.clientX, e.clientY));

        // Touch – full parity with mouse
        jet.addEventListener("touchstart", e => {
            if (e.touches.length !== 1) return;
            e.preventDefault();
            const t = e.touches[0];
            startDrag(t.clientX, t.clientY);
        }, {passive: false});

        window.addEventListener("touchend", endDrag);
        window.addEventListener("touchcancel", endDrag);

        window.addEventListener("touchmove", e => {
            if (!dragging || isLanding || e.touches.length !== 1) return;
            e.preventDefault();
            const t = e.touches[0];
            moveDrag(t.clientX, t.clientY);
        }, {passive: false});

        // Optional: wheel / trackpad “scroll” also drops the middle of the jet
        window.addEventListener("wheel", e => {
            if (isLanding) return;
            e.preventDefault();
            scrollAccum += e.deltaY * 0.0008;
            targetDepth = Math.max(0.35, Math.min(1.1, targetDepth - scrollAccum));
            scrollAccum *= 0.6; // damping
            jet.classList.toggle("closer", targetDepth > 0.6);
        }, {passive: false});

        let idleMode = true;
        const cancelIdle = () => idleMode = false;
        ["mousemove","mousedown","keydown","touchstart"].forEach(ev => 
            window.addEventListener(ev, cancelIdle)
        );

        function blinkSide(id) {
            const el = document.getElementById(id);
            el.style.opacity = "1";
            setTimeout(() => el.style.opacity = "0", 160);
        }

        function animate() {
            // smooth depth approach (Stevens-like compressive feel)
            depth += (targetDepth - depth) * 0.07;

            if (!isLanding) {
                jet.style.left = jetX + "px";
                jet.style.top  = jetY + "px";

                // transform-origin is already middle → drop/scroll focuses there
                let t = `translate(-50%, -50%) 
                         rotate(${bank}deg) 
                         rotateX(${pitch}deg) 
                         scale(${depth})`;

                if (idleMode) {
                    pitch += 0.012;
                    const idleBank = Math.sin(Date.now() / 2400) * 1.8;
                    // gentle floating while still deep
                    t = `translate(-50%, -50%) 
                         rotate(${idleBank}deg) 
                         rotateX(${pitch}deg) 
                         scale(${depth * 1.03})`;
                }
                jet.style.transform = t;
            }

            if (jetX < 60) blinkSide("blinkLeft");
            if (jetX > window.innerWidth - 60) blinkSide("blinkRight");

            requestAnimationFrame(animate);
        }
        animate();

        document.getElementById("dollarLink").onclick = () => {
            window.location.href = "https://htmlpreview.github.io/?https://github.com/DreamTexc/DreamTech/blob/main/dollar.html";
        };
        document.getElementById("moduleRef").onclick = () => {
            alert("Module Reference → popModule is focused on pop.png\nJet starts deep (Stevens depth) – drag or scroll to bring it forward.");
        };

        window.addEventListener("resize", () => {
            jetX = Math.min(Math.max(jetX, 40), window.innerWidth - 40);
            jetY = Math.min(Math.max(jetY, 40), window.innerHeight - 40);
        });
    </script>
</body>
</html>
