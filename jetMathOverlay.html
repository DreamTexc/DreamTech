<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Architecture with Math Overlay</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            text-align: center;
            background: url("https://images.unsplash.com/photo-1508614589041-5a9c4a0f7c52?auto=format&fit=crop&w=1600&q=80")
                repeat-x;
            background-size: cover;
            animation: parallaxScroll 20s linear infinite;
        }

        @keyframes parallaxScroll {
            from { background-position: 0 0; }
            to { background-position: -2000px 0; }
        }

        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .pointer {
            cursor: pointer;
            text-decoration: underline;
            color: #00aaff;
            font-size: 20px;
        }

        .pointer:hover {
            color: #0088cc;
        }

        .jet {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 300px;
            transform: translate(-50%, -50%);
            transition: transform 0.1s linear;
            cursor: grab;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
            opacity: 1;
            transition: opacity 0.8s ease;
            z-index: 20;
        }
    </style>
</head>

<body>

    <div id="ui">
        <span class="pointer" id="moduleRef">Module Reference</span>
    </div>

    <img id="jet" class="jet"
        src="https://th.bing.com/th/id/OIP.9FP89-HLK-BYghgyHBsoowAAAA?w=298&h=200&c=7&r=0&o=5&dpr=1.5&pid=1.7">

    <div class="overlay" id="mathOverlay">
        $$\lim_{{x \to a}} (bx + c) = ba + c$$
    </div>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script>
        /* ---------------------------------------------------------
           ASVIB JOYSTICK MOVEMENT ENGINE
        --------------------------------------------------------- */
        function ASVIB(element) {
            let dragging = false;
            let offsetX = 0;
            let offsetY = 0;

            element.addEventListener("mousedown", (e) => {
                dragging = true;
                offsetX = e.clientX - element.offsetLeft;
                offsetY = e.clientY - element.offsetTop;
                element.style.cursor = "grabbing";
            });

            document.addEventListener("mouseup", () => {
                dragging = false;
                element.style.cursor = "grab";
            });

            document.addEventListener("mousemove", (e) => {
                if (!dragging) return;

                let x = e.clientX - offsetX;
                let y = e.clientY - offsetY;

                element.style.left = x + "px";
                element.style.top = y + "px";
            });
        }

        // Activate joystick movement
        ASVIB(document.getElementById("jet"));

        /* ---------------------------------------------------------
           MODULE OVERLAY SYSTEM
        --------------------------------------------------------- */
        const moduleRef = {
            name: "jetMathOverlay",
            version: "1.0.0",

            init: function() {
                const params = new URLSearchParams(window.location.search);
                const engineType = params.get("engineType");
                const wingSpan = params.get("wingSpan");
                const material = params.get("material");

                const overlay = document.getElementById("mathOverlay");

                overlay.style.opacity = "1";

                overlay.textContent =
                    `Engine Type: ${engineType}\n` +
                    `Wing Span: ${wingSpan}\n` +
                    `Material: ${material}\n\n` +
                    `$$\\lim_{{x \\to a}} (bx + c) = ba + c$$`;

                MathJax.typesetPromise().then(() => {
                    setTimeout(() => {
                        overlay.style.opacity = "0";
                    }, 3000);
                });
            }
        };

        document.getElementById("moduleRef").addEventListener("click", () => {
            moduleRef.init();
            alert(`Module "${moduleRef.name}" initialized!`);
        });

        // Hide overlay on load
        window.onload = () => {
            setTimeout(() => {
                document.getElementById("mathOverlay").style.opacity = "0";
            }, 1500);
        };
    </script>

</body>
</html>
