<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar Page – 6D Vortex Polarity</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background: #0a0a12;
            color: #eee;
            overflow-x: hidden;
            user-select: none;
            min-height: 100vh;
        }

        .back-link { margin-bottom: 5px; }
        .back-link a { color: #88aaff; }

        /* Scorekeeper Popup */
        .score-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 15px; border-radius: 10px;
            width: 40%; max-width: 250px;
            text-align: center; color: white;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: monospace; z-index: 9999;
        }
        .score-popup.active { opacity: 1; pointer-events: auto; }
        .vertex-line { font-size: 14px; margin: 6px 0; letter-spacing: 1px; }
        .red { color: #ff2a2a; }
        .black { color: #111; }

        /* HACO VAULT */
        .sku-box {
            margin-top: 60px;
            width: 100%;
            max-width: 1100px;
            height: 520px;
            margin-left: auto; margin-right: auto;
            position: relative;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            overflow: visible;
            perspective: 1400px;
            background: radial-gradient(ellipse at center, #0d0d18 0%, #05050a 70%);
        }

        /* 6-D Jet – now 30% smaller than previous (38.5% of original) */
        .sku-img {
            width: calc(140px * 3.2 * 0.55 * 0.7);   /* 30% smaller than last version */
            position: absolute;
            left: 50%; top: 50%;
            transform-origin: center center;
            transform: translate(-50%, -50%) rotate(-48deg) rotateX(18deg) rotateY(0deg) rotateZ(0deg) scale(1);
            filter: drop-shadow(0 12px 20px rgba(0,0,0,0.7));
            will-change: transform;
            transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 10;
        }

        /* Subtle vault flutter */
        @keyframes hacoVaultFlutter {
            0%   { transform: translate(-50%, -50%) translate(0px,0px) rotate(-48deg) rotateX(18deg) rotateY(0deg) scale(1); }
            25%  { transform: translate(-50%, -50%) translate(9.9px,4.2px) rotate(-49.5deg) rotateX(19deg) rotateY(2deg) scale(1.01); }
            50%  { transform: translate(-50%, -50%) translate(-6.8px,9.9px) rotate(-47deg) rotateX(17deg) rotateY(-1deg) scale(0.99); }
            75%  { transform: translate(-50%, -50%) translate(4.5px,-7.4px) rotate(-49deg) rotateX(18.5deg) rotateY(1deg) scale(1.005); }
            100% { transform: translate(-50%, -50%) translate(0px,0px) rotate(-48deg) rotateX(18deg) rotateY(0deg) scale(1); }
        }
        .haco-flutter { animation: hacoVaultFlutter 3.6s ease-in-out infinite; }

        /* Level flight */
        .level-flight {
            animation: none !important;
            transform: translate(-50%, -50%) rotate(0deg) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1) !important;
        }

        .score-btn {
            padding: 6px 12px; background: #ff2a2a; border: none;
            border-radius: 6px; font-size: 12px; cursor: pointer;
            margin-top: 8px; color: white; transition: 0.25s;
        }
        .score-btn:hover { background: #cc0000; transform: scale(1.05); }

        .console-box { margin-top: 30px; }
        #commandInput {
            padding: 11px; width: 320px; font-size: 14px;
            border-radius: 6px; border: 1px solid #444;
            background: #111; color: #fff; text-align: center;
        }

        #spaceStatus {
            margin-top: 14px; font-size: 13px; color: #888;
            font-family: monospace;
        }
        #spaceStatus.active { color: #4cff4c; }

        #polarityStatus {
            margin-top: 8px; font-size: 12px; color: #66aaff;
            font-family: monospace; letter-spacing: 0.5px;
        }
    </style>
</head>
