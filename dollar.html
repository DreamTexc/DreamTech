<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background: #0a0a12;
            color: #eee;
            overflow-x: hidden;
        }

        .back-link {
            margin-bottom: 5px;
        }

        .back-link a {
            color: #88aaff;
        }

        /* Scorekeeper Popup */
        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            width: 40%;
            max-width: 250px;
            text-align: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: monospace;
            z-index: 9999;
        }

        .score-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .vertex-line {
            font-size: 14px;
            margin: 6px 0;
            letter-spacing: 1px;
        }

        .red { color: #ff2a2a; }
        .black { color: #111; }

        /* SKU / Jet container */
        .sku-box {
            margin-top: 80px;
            height: 420px;
            position: relative;
            perspective: 900px;
        }

        .sku-img {
            width: calc(140px * 3.2);
            display: block;
            margin: 0 auto;
            transform-origin: center center;
            /* Steep diving angle (pilot view) */
            transform: rotate(-38deg) rotateX(12deg);
            transition: transform 0.3s ease;
            filter: drop-shadow(0 12px 18px rgba(0,0,0,0.55));
        }

        /* Continuous diving / flight cycle */
        @keyframes continuousDive {
            0% {
                transform: translate(0, 0) rotate(-38deg) rotateX(12deg) scale(1);
            }
            25% {
                transform: translate(18vw, 12vh) rotate(-42deg) rotateX(18deg) scale(1.08);
            }
            50% {
                transform: translate(-8vw, 28vh) rotate(-35deg) rotateX(8deg) scale(1.15);
            }
            75% {
                transform: translate(22vw, 18vh) rotate(-45deg) rotateX(22deg) scale(1.05);
            }
            100% {
                transform: translate(0, 0) rotate(-38deg) rotateX(12deg) scale(1);
            }
        }

        .dive-cycle {
            animation: continuousDive 4.8s ease-in-out infinite;
        }

        /* Subtle engine flutter on top of the dive */
        @keyframes flutter {
            0%, 100% { filter: drop-shadow(0 12px 18px rgba(0,0,0,0.55)); }
            50% { filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)); }
        }

        .flutter-effect {
            animation: continuousDive 4.8s ease-in-out infinite,
                       flutter 0.28s infinite ease-in-out;
        }

        /* Trigger Button */
        .score-btn {
            padding: 6px 10px;
            background: #ff2a2a;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.25s;
            color: white;
        }

        .score-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        /* Command Console */
        .console-box {
            margin-top: 40px;
        }

        #commandInput {
            padding: 10px;
            width: 260px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Dollar Page</h1>
    <p>Welcome to the Dollar Page.</p>
    <p>Add your content here.</p>

    <!-- Back to Jet Action link -->
    <div class="back-link">
        <a href="https://htmlpreview.github.io/?https://github.com/DreamTexc/DreamTech/blob/main/jetMathOverlay.html">
            Back to Jet Action
        </a>
    </div>

    <!-- Trigger Button -->
    <button id="openScore" class="score-btn">Open Scorekeeper</button>

    <!-- Scorekeeper Popup -->
    <div id="scorePopup" class="score-popup">
        <div class="score-content">
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
        </div>
    </div>

    <!-- Jet / SKU Image -->
    <div id="skuBox" class="sku-box">
        <img src="https://raw.githubusercontent.com/DreamTexc/DreamTech/main/sku.png"
             alt="SKU Jet"
             class="sku-img flutter-effect">
    </div>

    <!-- Command Console -->
    <div class="console-box">
        <input id="commandInput" type="text" placeholder="Enter command...">
    </div>

    <script>
        // Scorekeeper popup
        document.getElementById("openScore").onclick = () => {
            const popup = document.getElementById("scorePopup");
            popup.classList.add("active");

            setTimeout(() => {
                popup.classList.remove("active");
            }, 3000);
        };

        // Jet is already running the continuous dive cycle via CSS class
        const skuImage = document.querySelector(".sku-img");

        // Optional: still react to the old command if you type it
        document.getElementById("commandInput").addEventListener("keyup", function(e) {
            const cmd = e.target.value.trim();
            const pattern = /into\.page\sseek/i;

            if (pattern.test(cmd)) {
                // Restart the cycle for a strong “boost” feel
                skuImage.classList.remove("flutter-effect");
                void skuImage.offsetWidth; // force reflow
                skuImage.classList.add("flutter-effect");
            }
        });

        // Placeholder for future MPH / spacebar race system
        // (will be added later)
    </script>

</body>
</html>
