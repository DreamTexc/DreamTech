<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }

        /* Back to Jet Action link spacing */
        .back-link {
            margin-bottom: 5px;
        }

        /* Scorekeeper Popup (reduced by ~50%) */
        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            width: 40%;
            max-width: 250px;
            text-align: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: monospace;
            z-index: 9999;
        }

        .score-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .vertex-line {
            font-size: 14px;
            margin: 6px 0;
            letter-spacing: 1px;
        }

        .red { color: #ff2a2a; }
        .black { color: #111; }

        /* Clean SKU image — no border, no box, no shadow */
        .sku-box {
            margin-top: 160px;
        }

        .sku-img {
            width: calc(140px * 3.2);
            display: block;
            margin: 0 auto;
        }

        /* Command Console */
        .console-box {
            margin-top: 40px;
        }

        #commandInput {
            padding: 10px;
            width: 260px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            text-align: center;
        }

        /* SKU flight animation */
        @keyframes flyToCenter {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(50vw, -20vh) scale(1.4);
                opacity: 0.9;
            }
            100% {
                transform: translate(0, -40vh) scale(2.2);
                opacity: 0.6;
            }
        }

        .fly-effect {
            animation: flyToCenter 2.4s ease-in-out forwards;
        }

        /* Continuous flutter */
        .flutter-effect {
            animation: flutter 0.35s infinite ease-in-out;
        }

        @keyframes flutter {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
            100% { transform: translateY(0px); }
        }

        /* Trigger Button (reduced by ~50%) */
        .score-btn {
            padding: 6px 10px;
            background: #ff2a2a;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.25s;
        }

        .score-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>Dollar Page</h1>
    <p>Welcome to the Dollar Page.</p>
    <p>Add your content here.</p>

    <!-- Back to Jet Action link -->
    <div class="back-link">
        <a href="https://htmlpreview.github.io/?https://github.com/DreamTexc/DreamTech/blob/main/jetMathOverlay.html">
            Back to Jet Action
        </a>
    </div>

    <!-- Trigger Button -->
    <button id="openScore" class="score-btn">Open Scorekeeper</button>

    <!-- Scorekeeper Popup -->
    <div id="scorePopup" class="score-popup">
        <div class="score-content">
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
        </div>
    </div>

    <!-- Clean SKU Image -->
    <div id="skuBox" class="sku-box">
        <img src="https://raw.githubusercontent.com/DreamTexc/DreamTech/main/sku.png"
             alt="SKU"
             class="sku-img">
    </div>

    <!-- Command Console -->
    <div class="console-box">
        <input id="commandInput" type="text" placeholder="Enter command...">
    </div>

    <script>
        // Scorekeeper popup
        document.getElementById("openScore").onclick = () => {
            const popup = document.getElementById("scorePopup");
            popup.classList.add("active");

            setTimeout(() => {
                popup.classList.remove("active");
            }, 3000);
        };

        // SKU element
        const skuImage = document.querySelector(".sku-img");

        // Continuous flutter always on
        skuImage.classList.add("flutter-effect");

        // Command console listener
        document.getElementById("commandInput").addEventListener("keyup", function(e) {
            const cmd = e.target.value.trim();

            // REGEX pattern for your custom command
            const pattern = /into\.page\sseek/i;

            // If command matches → trigger flight animation
            if (pattern.test(cmd)) {
                skuImage.classList.add("fly-effect");
            }
        });
    </script>

</body>
</html>
