<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background: #0a0a12;
            color: #eee;
            overflow-x: hidden;
            user-select: none;
        }

        .back-link {
            margin-bottom: 5px;
        }

        .back-link a {
            color: #88aaff;
        }

        /* Scorekeeper Popup */
        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            width: 40%;
            max-width: 250px;
            text-align: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: monospace;
            z-index: 9999;
        }

        .score-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .vertex-line {
            font-size: 14px;
            margin: 6px 0;
            letter-spacing: 1px;
        }

        .red { color: #ff2a2a; }
        .black { color: #111; }

        /* HACO VAULT */
        .sku-box {
            margin-top: 100px;
            width: 100%;
            max-width: 900px;
            height: 420px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            overflow: hidden;
            perspective: 1000px;
        }

        .sku-img {
            width: calc(140px * 3.2);
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center center;
            /* Default: steep downward angle */
            transform: translate(-50%, -50%) rotate(-48deg) rotateX(18deg);
            filter: drop-shadow(0 10px 16px rgba(0,0,0,0.6));
            will-change: transform;
            transition: transform 0.45s ease;
            z-index: 2;
        }

        /* Subtle haco vault flutter (19.8 × 19.8 range) */
        @keyframes hacoVaultFlutter {
            0%   { transform: translate(-50%, -50%) translate(0px, 0px) rotate(-48deg) rotateX(18deg); }
            25%  { transform: translate(-50%, -50%) translate(9.9px, 4.2px) rotate(-49.5deg) rotateX(19deg); }
            50%  { transform: translate(-50%, -50%) translate(-6.8px, 9.9px) rotate(-47deg) rotateX(17deg); }
            75%  { transform: translate(-50%, -50%) translate(4.5px, -7.4px) rotate(-49deg) rotateX(18.5deg); }
            100% { transform: translate(-50%, -50%) translate(0px, 0px) rotate(-48deg) rotateX(18deg); }
        }

        .haco-flutter {
            animation: hacoVaultFlutter 3.6s ease-in-out infinite;
        }

        /* Level flight state (perfectly even) */
        .level-flight {
            animation: none !important;
            transform: translate(-50%, -50%) rotate(0deg) rotateX(0deg) !important;
        }

        /* ========== TARGETING SYSTEM (Circle-Dot Alignment) ========== */
        .target-reticle {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 220px;
            height: 220px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            opacity: 0.9;
        }

        /* Outer circle */
        .target-reticle::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 42, 42, 0.75);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 42, 42, 0.35);
        }

        /* Middle circle */
        .target-reticle::after {
            content: "";
            position: absolute;
            inset: 28px;
            border: 1.5px solid rgba(255, 80, 80, 0.55);
            border-radius: 50%;
        }

        /* Center dot (primary alignment point) */
        .target-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 10px;
            height: 10px;
            background: #ff2a2a;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff2a2a, 0 0 18px rgba(255, 42, 42, 0.6);
            z-index: 6;
        }

        /* Crosshair lines */
        .crosshair-h, .crosshair-v {
            position: absolute;
            background: rgba(255, 42, 42, 0.7);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .crosshair-h {
            width: 160px;
            height: 1px;
        }
        .crosshair-v {
            width: 1px;
            height: 160px;
        }

        /* Small tick marks on the outer ring */
        .tick {
            position: absolute;
            background: rgba(255, 80, 80, 0.8);
            left: 50%;
            top: 50%;
            transform-origin: center;
        }
        .tick.t12 { width: 2px; height: 12px; transform: translate(-50%, -110px); }
        .tick.t3  { width: 12px; height: 2px; transform: translate(98px, -50%); }
        .tick.t6  { width: 2px; height: 12px; transform: translate(-50%, 98px); }
        .tick.t9  { width: 12px; height: 2px; transform: translate(-110px, -50%); }

        /* Subtle pulse on the reticle when space is engaged */
        .target-reticle.locked {
            animation: reticlePulse 1.4s ease-in-out infinite;
        }
        @keyframes reticlePulse {
            0%, 100% { opacity: 0.9; filter: brightness(1); }
            50%      { opacity: 1;   filter: brightness(1.25); }
        }

        .score-btn {
            padding: 6px 10px;
            background: #ff2a2a;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.25s;
            color: white;
        }

        .score-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        .console-box {
            margin-top: 40px;
        }

        #commandInput {
            padding: 10px;
            width: 260px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            text-align: center;
        }

        /* Small spacebar status indicator */
        #spaceStatus {
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            font-family: monospace;
        }
        #spaceStatus.active {
            color: #4cff4c;
        }
    </style>
</head>

<body>

    <h1>Dollar Page</h1>
    <p>Welcome to the Dollar Page.</p>
    <p>Add your content here.</p>

    <div class="back-link">
        <a href="https://htmlpreview.github.io/?https://github.com/DreamTexc/DreamTech/blob/main/jetMathOverlay.html">
            Back to Jet Action
        </a>
    </div>

    <button id="openScore" class="score-btn">Open Scorekeeper</button>

    <div id="scorePopup" class="score-popup">
        <div class="score-content">
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
        </div>
    </div>

    <!-- HACO VAULT -->
    <div id="skuBox" class="sku-box">
        <!-- Targeting reticle (circle-dot alignment system) -->
        <div class="target-reticle" id="reticle">
            <div class="crosshair-h"></div>
            <div class="crosshair-v"></div>
            <div class="tick t12"></div>
            <div class="tick t3"></div>
            <div class="tick t6"></div>
            <div class="tick t9"></div>
            <div class="target-dot"></div>
        </div>

        <img src="https://raw.githubusercontent.com/DreamTexc/DreamTech/main/sku.png"
             alt="SKU Jet"
             class="sku-img haco-flutter"
             id="jetImage">
    </div>

    <div id="spaceStatus">SPACEBAR: STANDBY</div>

    <div class="console-box">
        <input id="commandInput" type="text" placeholder="Enter command...">
    </div>

    <script>
        // ====================== STD FUNCTION ======================
        // Applies only to the jet image + spacebar
        function std(jet, isEngaged, deltaTime) {
            if (!isEngaged) return;

            // Level the jet perfectly even
            jet.classList.remove("haco-flutter");
            jet.classList.add("level-flight");

            // Accelerate while held
            speed += acceleration * deltaTime;

            // Move across the screen (flight path)
            posX += speed * deltaTime;

            // Apply position (keeps vertical centered)
            jet.style.left = `calc(50% + ${posX}px)`;
            jet.style.top = "50%";
        }
        // ==========================================================

        const jet = document.getElementById("jetImage");
        const status = document.getElementById("spaceStatus");
        const reticle = document.getElementById("reticle");

        let spaceEngaged = false;
        let posX = 0;
        let speed = 0;
        const acceleration = 38;   // how fast it gains speed
        const maxSpeed = 420;
        let lastTime = performance.now();

        // Spacebar monitor
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();          // stop page scroll
                if (!spaceEngaged) {
                    spaceEngaged = true;
                    status.textContent = "SPACEBAR: ENGAGED – LEVEL FLIGHT";
                    status.classList.add("active");
                    reticle.classList.add("locked");   // pulse the targeting system
                    // Reset starting speed for clean engagement
                    speed = 12;
                }
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "Space") {
                spaceEngaged = false;
                status.textContent = "SPACEBAR: STANDBY";
                status.classList.remove("active");
                reticle.classList.remove("locked");

                // Return to dive posture & vault flutter
                jet.classList.remove("level-flight");
                jet.style.left = "50%";
                jet.style.top = "50%";
                posX = 0;
                speed = 0;
                jet.classList.add("haco-flutter");
            }
        });

        // Main loop
        function gameLoop(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Cap speed
            if (speed > maxSpeed) speed = maxSpeed;

            // Call the std function (only affects jet + spacebar)
            std(jet, spaceEngaged, deltaTime);

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        // Scorekeeper (unchanged)
        document.getElementById("openScore").onclick = () => {
            const popup = document.getElementById("scorePopup");
            popup.classList.add("active");
            setTimeout(() => popup.classList.remove("active"), 3000);
        };

        // Optional command
        document.getElementById("commandInput").addEventListener("keyup", function(e) {
            const cmd = e.target.value.trim();
            if (/into\.page\sseek/i.test(cmd)) {
                if (!spaceEngaged) {
                    jet.classList.remove("haco-flutter");
                    void jet.offsetWidth;
                    jet.classList.add("haco-flutter");
                }
            }
        });
    </script>

</body>
</html>
