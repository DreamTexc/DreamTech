<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }

        /* Scorekeeper Popup */
        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border-radius: 12px;
            width: 80%;
            max-width: 500px;
            text-align: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: monospace;
            z-index: 9999;
        }

        .score-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .vertex-line {
            font-size: 20px;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .red {
            color: #ff2a2a;
        }

        .black {
            color: #111;
        }

        /* Standalone SKU Element */
        .sku-box {
            margin-top: 25px;
            padding: 15px;
            display: inline-block;
            background: #111;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.45);
            cursor: pointer;
        }

        .sku-img {
            width: 140px;
            border-radius: 8px;
        }

        /* Trigger Button */
        .score-btn {
            padding: 12px 20px;
            background: #ff2a2a;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.25s;
        }

        .score-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>Dollar Page</h1>
    <p>Welcome to the Dollar Page.</p>
    <p>Add your content here.</p>

    <p>
        <a href="https://htmlpreview.github.io/?https://github.com/DreamTexc/DreamTech/blob/main/jetMathOverlay.html">
            Back to Jet Action
        </a>
    </p>

    <!-- Standalone SKU Element -->
    <div id="skuBox" class="sku-box">
        <img src="https://raw.githubusercontent.com/DreamTexc/DreamTech/main/sku.png"
             alt="SKU"
             class="sku-img">
    </div>

    <!-- Scorekeeper Popup -->
    <div id="scorePopup" class="score-popup">
        <div class="score-content">
            <div class="vertex-line red">.............||||||||||||||||.............</div>
            <div class="vertex-line black">||||||||||||||.............||||||||||||||</div>
            <div class="vertex-line red">.............||||||||||||||||.............</div>
            <div class="vertex-line black">||||||||||||||.............||||||||||||||</div>
        </div>
    </div>

    <!-- Trigger Button -->
    <button id="openScore" class="score-btn">Open Scorekeeper</button>

    <script>
        // Scorekeeper popup
        document.getElementById("openScore").onclick = () => {
            const popup = document.getElementById("scorePopup");
            popup.classList.add("active");

            setTimeout(() => {
                popup.classList.remove("active");
            }, 3000);
        };

        // Standalone SKU action
        document.getElementById("skuBox").onclick = () => {
            alert("SKU Activated!");
        };
    </script>

</body>
</html>
