<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }

        /* Scorekeeper Popup */
        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border-radius: 12px;
            width: 80%;
            max-width: 500px;
            text-align: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: monospace;
            z-index: 9999;
        }

        .score-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .vertex-line {
            font-size: 20px;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .red {
            color: #ff2a2a;
        }

        .black {
            color: #111;
        }

        /* Trigger Button */
        .score-btn {
            padding: 12px 20px;
            background: #ff2a2a;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.25s;
        }

        .score-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>Dollar Page</h1>
    <p>Welcome to the Dollar Page.</p>
    <p>Add your content here.</p>
    <p><a href="https://dreamtexc.github.io/DreamTech">Back to Jet Action</a></p>


    <!-- Scorekeeper Popup -->
    <div id="scorePopup" class="score-popup">
        <div class="score-content">
            <div class="vertex-line red">.............||||||||||||||||.............</div>
            <div class="vertex-line black">||||||||||||||.............||||||||||||||</div>
            <div class="vertex-line red">.............||||||||||||||||.............</div>
            <div class="vertex-line black">||||||||||||||.............||||||||||||||</div>
        </div>
    </div>

    <!-- Trigger Button -->
    <button id="openScore" class="score-btn">Open Scorekeeper</button>

    <script>
        document.getElementById("openScore").onclick = () => {
            const popup = document.getElementById("scorePopup");
            popup.classList.add("active");

            // Auto-hide after 3 seconds
            setTimeout(() => {
                popup.classList.remove("active");
            }, 3000);
        };
    </script>

</body>
</html>
