<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background: #0a0a12;
            color: #eee;
            overflow-x: hidden;
        }

        .back-link {
            margin-bottom: 5px;
        }

        .back-link a {
            color: #88aaff;
        }

        /* Scorekeeper Popup */
        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            width: 40%;
            max-width: 250px;
            text-align: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: monospace;
            z-index: 9999;
        }

        .score-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .vertex-line {
            font-size: 14px;
            margin: 6px 0;
            letter-spacing: 1px;
        }

        .red { color: #ff2a2a; }
        .black { color: #111; }

        /* HACO VAULT – fixed frame of existence */
        .sku-box {
            margin-top: 100px;
            width: 480px;
            height: 420px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            /* Optional subtle vault border (can be removed later) */
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            overflow: hidden; /* keeps the jet inside the vault */
            perspective: 1000px;
        }

        .sku-img {
            width: calc(140px * 3.2);
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center center;
            /* Steep downward pointing angle */
            transform: translate(-50%, -50%) rotate(-48deg) rotateX(18deg);
            filter: drop-shadow(0 10px 16px rgba(0,0,0,0.6));
            will-change: transform;
        }

        /* Subtle continuous motion inside the 19.8 × 19.8 haco vault range */
        @keyframes hacoVaultFlutter {
            0% {
                transform: translate(-50%, -50%) 
                           translate(0px, 0px) 
                           rotate(-48deg) rotateX(18deg);
            }
            25% {
                transform: translate(-50%, -50%) 
                           translate(9.9px, 4.2px) 
                           rotate(-49.5deg) rotateX(19deg);
            }
            50% {
                transform: translate(-50%, -50%) 
                           translate(-6.8px, 9.9px) 
                           rotate(-47deg) rotateX(17deg);
            }
            75% {
                transform: translate(-50%, -50%) 
                           translate(4.5px, -7.4px) 
                           rotate(-49deg) rotateX(18.5deg);
            }
            100% {
                transform: translate(-50%, -50%) 
                           translate(0px, 0px) 
                           rotate(-48deg) rotateX(18deg);
            }
        }

        .haco-flutter {
            animation: hacoVaultFlutter 3.6s ease-in-out infinite;
        }

        /* Trigger Button */
        .score-btn {
            padding: 6px 10px;
            background: #ff2a2a;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.25s;
            color: white;
        }

        .score-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        /* Command Console */
        .console-box {
            margin-top: 40px;
        }

        #commandInput {
            padding: 10px;
            width: 260px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Dollar Page</h1>
    <p>Welcome to the Dollar Page.</p>
    <p>Add your content here.</p>

    <div class="back-link">
        <a href="https://htmlpreview.github.io/?https://github.com/DreamTexc/DreamTech/blob/main/jetMathOverlay.html">
            Back to Jet Action
        </a>
    </div>

    <button id="openScore" class="score-btn">Open Scorekeeper</button>

    <div id="scorePopup" class="score-popup">
        <div class="score-content">
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
        </div>
    </div>

    <!-- HACO VAULT -->
    <div id="skuBox" class="sku-box">
        <img src="https://raw.githubusercontent.com/DreamTexc/DreamTech/main/sku.png"
             alt="SKU Jet"
             class="sku-img haco-flutter">
    </div>

    <div class="console-box">
        <input id="commandInput" type="text" placeholder="Enter command...">
    </div>

    <script>
        // Scorekeeper
        document.getElementById("openScore").onclick = () => {
            const popup = document.getElementById("scorePopup");
            popup.classList.add("active");
            setTimeout(() => popup.classList.remove("active"), 3000);
        };

        const skuImage = document.querySelector(".sku-img");

        // Optional command boost (restarts the subtle cycle)
        document.getElementById("commandInput").addEventListener("keyup", function(e) {
            const cmd = e.target.value.trim();
            if (/into\.page\sseek/i.test(cmd)) {
                skuImage.classList.remove("haco-flutter");
                void skuImage.offsetWidth;
                skuImage.classList.add("haco-flutter");
            }
        });

        // Ready for future game systems (MPH, spacebar race, effects, etc.)
    </script>

</body>
</html>
