<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }

        /* Back to Jet Action link spacing */
        .back-link {
            margin-bottom: 5px; /* pulls button directly under it */
        }

        /* Scorekeeper Popup (reduced by ~50%) */
        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            width: 40%;
            max-width: 250px;
            text-align: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: monospace;
            z-index: 9999;
        }

        .score-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .vertex-line {
            font-size: 14px;
            margin: 6px 0;
            letter-spacing: 1px;
        }

        .red { color: #ff2a2a; }
        .black { color: #111; }

        /* Standalone SKU Element (MUCH larger + clearly under button) */
        .sku-box {
            margin-top: 160px; /* pushes SKU clearly below button */
            padding: 30px;
            display: inline-block;
            background: #111;
            border-radius: 14px;
            box-shadow: 0 0 26px rgba(255, 0, 0, 0.55);
            cursor: pointer;
        }

        .sku-img {
            width: calc(140px * 3.2); /* MASSIVE increase */
            border-radius: 14px;
        }

        /* Trigger Button (reduced by ~50%) */
        .score-btn {
            padding: 6px 10px;
            background: #ff2a2a;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px; /* sits directly under Back to Jet Action */
            transition: 0.25s;
        }

        .score-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>Dollar Page</h1>
    <p>Welcome to the Dollar Page.</p>
    <p>Add your content here.</p>

    <!-- Back to Jet Action link -->
    <div class="back-link">
        <a href="https://htmlpreview.github.io/?https://github.com/DreamTexc/DreamTech/blob/main/jetMathOverlay.html">
            Back to Jet Action
        </a>
    </div>

    <!-- Trigger Button (now directly under Back to Jet Action) -->
    <button id="openScore" class="score-btn">Open Scorekeeper</button>

    <!-- Scorekeeper Popup (reduced) -->
    <div id="scorePopup" class="score-popup">
        <div class="score-content">
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
            <div class="vertex-line red">........||||||||||||........</div>
            <div class="vertex-line black">||||||||........||||||||</div>
        </div>
    </div>

    <!-- Standalone SKU Element (larger + bottom placement) -->
    <div id="skuBox" class="sku-box">
        <img src="https://raw.githubusercontent.com/DreamTexc/DreamTech/main/sku.png"
             alt="SKU"
             class="sku-img">
    </div>

    <script>
        // Scorekeeper popup
        document.getElementById("openScore").onclick = () => {
            const popup = document.getElementById("scorePopup");
            popup.classList.add("active");

            setTimeout(() => {
                popup.classList.remove("active");
            }, 3000);
        };

        // Standalone SKU action
        document.getElementById("skuBox").onclick = () => {
            alert("SKU Activated!");
        };
    </script>

</body>
</html>
