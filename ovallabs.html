<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus × Rollover $ Class</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;display:flex;justify-content:center;align-items:center;
      background:#0f0f0f;font-family:system-ui,sans-serif;color:#e0e0e0;overflow:hidden;
    }
    .${
      position:relative;display:inline-block;outline:none;border-radius:8px;
      perspective:1200px;transform-style:preserve-3d;
    }

    /* Draggable jet */
    .$ img.acc{
      max-width:90vw;max-height:80vh;display:block;border-radius:8px;
      cursor:grab;touch-action:none;user-select:none;
      will-change:transform;
      position:relative;z-index:5;
      transition:none;
    }
    .$ img.acc:active{cursor:grabbing}

    /* 720° full tilt + roll maneuver */
    .$ img.acc.spinning{
      animation:fullManeuver 2.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes fullManeuver{
      0%   {transform:translate(var(--x,0px),var(--y,0px)) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1)}
      25%  {transform:translate(var(--x,0px),var(--y,0px)) rotateX(25deg) rotateY(180deg) rotateZ(180deg) scale(1.05)}
      50%  {transform:translate(var(--x,0px),var(--y,0px)) rotateX(-15deg) rotateY(360deg) rotateZ(360deg) scale(1.1)}
      75%  {transform:translate(var(--x,0px),var(--y,0px)) rotateX(20deg) rotateY(540deg) rotateZ(540deg) scale(1.05)}
      100% {transform:translate(var(--x,0px),var(--y,0px)) rotateX(0deg) rotateY(720deg) rotateZ(720deg) scale(1)}
    }

    /* Corner decorations */
    .mod{position:absolute;top:6px;width:64px;height:40px;opacity:.7;pointer-events:none;z-index:1}
    .mod.left{left:6px}
    .mod.right{right:6px}
    .mod svg{width:100%;height:100%}
    .mod .curve{stroke-dasharray:80;animation:draw 2.6s ease-in-out infinite alternate}
    @keyframes draw{to{stroke-dashoffset:0}}

    .venture{
      position:absolute;top:4px;width:180px;height:120px;
      perspective:300px;pointer-events:none;z-index:2;
      filter:blur(1.2px);opacity:.55;
    }
    .venture.left{left:4px}
    .venture.right{right:4px}
    .venture img{
      width:100%;height:100%;object-fit:cover;border-radius:8px;
      transform:rotateY(18deg) rotateX(6deg);
      box-shadow:0 6px 18px rgba(0,0,0,.45);
    }
    .venture.right img{transform:rotateY(-18deg) rotateX(6deg)}
  </style>
</head>
<body>

  <div class="$" id="acc-target">
    <div class="mod left">
      <svg viewBox="0 0 64 40">
        <line x1="4" y1="36" x2="60" y2="36" stroke="#555" stroke-width="1"/>
        <line x1="4" y1="36" x2="4" y2="4" stroke="#555" stroke-width="1"/>
        <path class="curve" d="M6 20 Q18 8 32 20 T58 20" fill="none" stroke="#7af" stroke-width="1.6"/>
      </svg>
    </div>
    <div class="mod right">
      <svg viewBox="0 0 64 40">
        <line x1="4" y1="36" x2="60" y2="36" stroke="#555" stroke-width="1"/>
        <line x1="4" y1="36" x2="4" y2="4" stroke="#555" stroke-width="1"/>
        <path class="curve" d="M6 20 Q18 32 32 20 T58 20" fill="none" stroke="#7af" stroke-width="1.6"/>
      </svg>
    </div>

    <div class="venture left"><img src="accr.png" alt=""></div>
    <div class="venture right"><img src="accr.png" alt=""></div>

    <img class="acc" src="acc.png" alt="acc" draggable="false">
  </div>

  <script>
    const jet = document.querySelector('img.acc');

    let isDragging = false;
    let isSpinning = false;
    let currentX = 0;
    let currentY = 0;
    let startX = 0;
    let startY = 0;

    function updatePosition() {
      if (isSpinning) return; // let the CSS animation control transform during spin
      jet.style.transform = `translate(${currentX}px, ${currentY}px)`;
      // Keep CSS variables in sync so the spin starts from the current location
      jet.style.setProperty('--x', currentX + 'px');
      jet.style.setProperty('--y', currentY + 'px');
    }

    // ----- Drag -----
    function startDrag(e) {
      if (isSpinning) return;
      isDragging = true;
      jet.style.cursor = 'grabbing';
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX - currentX;
      startY = pt.clientY - currentY;
      e.preventDefault();
      e.stopPropagation();
    }

    function duringDrag(e) {
      if (!isDragging || isSpinning) return;
      const pt = e.touches ? e.touches[0] : e;
      currentX = pt.clientX - startX;
      currentY = pt.clientY - startY;
      updatePosition();
      e.preventDefault();
    }

    function endDrag() {
      isDragging = false;
      jet.style.cursor = 'grab';
    }

    // Desktop
    jet.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', duringDrag);
    window.addEventListener('mouseup', endDrag);

    // Mobile
    jet.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', duringDrag, {passive: false});
    window.addEventListener('touchend', endDrag);
    window.addEventListener('touchcancel', endDrag);

    jet.addEventListener('dragstart', e => e.preventDefault());

    // ----- 720° Full Tilt + Roll Maneuver -----
    // Double-click (desktop) or double-tap (mobile) to trigger
    let lastTap = 0;

    function triggerSpin() {
      if (isSpinning) return;
      isSpinning = true;
      isDragging = false;

      // Sync current position into CSS variables
      jet.style.setProperty('--x', currentX + 'px');
      jet.style.setProperty('--y', currentY + 'px');

      jet.classList.add('spinning');

      // After animation finishes, clean up and restore drag control
      setTimeout(() => {
        jet.classList.remove('spinning');
        // Normalize rotation so it doesn’t jump
        jet.style.transform = `translate(${currentX}px, ${currentY}px) rotateX(0deg) rotateY(0deg) rotateZ(0deg)`;
        isSpinning = false;
      }, 2800);
    }

    // Desktop double-click
    jet.addEventListener('dblclick', triggerSpin);

    // Mobile double-tap
    jet.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTap < 300) {
        triggerSpin();
      }
      lastTap = now;
    });
  </script>

</body>
</html>
