<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus × Rollover $ Class</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#0f0f0f;font-family:system-ui,sans-serif;color:#e0e0e0;overflow:hidden}
    .${position:relative;display:inline-block;outline:none;transition:transform .25s ease,filter .25s ease,box-shadow .25s ease;border-radius:8px;cursor:pointer;perspective:1200px;transform-style:preserve-3d}
    .$:hover{transform:scale(1.06);filter:brightness(1.15);box-shadow:0 0 24px rgba(255,255,255,.15)}
    .$:focus{transform:scale(1.04);filter:brightness(1.1);box-shadow:0 0 0 3px rgba(100,180,255,.6)}
    .$:focus:hover{transform:scale(1.08);filter:brightness(1.2)}

    /* Main jet */
    .$ > img.acc{
      max-width:90vw;max-height:80vh;display:block;border-radius:8px;
      transform-origin:center center;
      transform-style:preserve-3d;
      transition:transform 1.8s ease, opacity 2.2s ease;
      animation:dropThenFly 4s ease-in forwards, flyForward 7s ease-in-out 4s infinite alternate;
      cursor:grab;
      touch-action:none;
      user-select:none;
    }
    .$ > img.acc:active{cursor:grabbing}

    .$ > img.acc.shrink{
      animation:none;
      transform:translateY(0) scale(0.70) translateZ(0);
    }
    .$ > img.acc.disappear{
      animation:none;
      transform:translateY(-28vh) scale(0.55) translateZ(-320px);
      opacity:0;
    }

    @keyframes dropThenFly{
      0%{transform:translateY(-40vh) scale(1) translateZ(0)}
      100%{transform:translateY(0) scale(0.65) translateZ(0)}
    }
    @keyframes flyForward{
      0%{transform:translateY(0) scale(0.65) translateZ(0)}
      100%{transform:translateY(0) scale(0.92) translateZ(220px)}
    }

    .mod{position:absolute;top:6px;width:64px;height:40px;opacity:.8;pointer-events:none;z-index:1}
    .mod.left{left:6px}
    .mod.right{right:6px}
    .mod svg{width:100%;height:100%}
    .mod .curve{stroke-dasharray:80;stroke-dashoffset:80;animation:draw 2.6s ease-in-out infinite alternate}
    @keyframes draw{to{stroke-dashoffset:0}}

    .venture{
      position:absolute;top:4px;width:180px;height:120px;
      perspective:300px;pointer-events:none;z-index:2;
      filter:blur(1.2px);opacity:.55;
    }
    .venture.left{left:4px}
    .venture.right{right:4px}
    .venture img{
      width:100%;height:100%;object-fit:cover;border-radius:8px;
      transform:rotateY(18deg) rotateX(6deg);
      box-shadow:0 6px 18px rgba(0,0,0,.45);
    }
    .venture.right img{transform:rotateY(-18deg) rotateX(6deg)}
  </style>
</head>
<body>

  <div class="$" tabindex="0" id="acc-target">
    <div class="mod left">
      <svg viewBox="0 0 64 40">
        <line x1="4" y1="36" x2="60" y2="36" stroke="#555" stroke-width="1"/>
        <line x1="4" y1="36" x2="4" y2="4" stroke="#555" stroke-width="1"/>
        <path class="curve" d="M6 20 Q18 8 32 20 T58 20" fill="none" stroke="#7af" stroke-width="1.6"/>
      </svg>
    </div>
    <div class="mod right">
      <svg viewBox="0 0 64 40">
        <line x1="4" y1="36" x2="60" y2="36" stroke="#555" stroke-width="1"/>
        <line x1="4" y1="36" x2="4" y2="4" stroke="#555" stroke-width="1"/>
        <path class="curve" d="M6 20 Q18 32 32 20 T58 20" fill="none" stroke="#7af" stroke-width="1.6"/>
      </svg>
    </div>

    <div class="venture left"><img src="accr.png" alt=""></div>
    <div class="venture right"><img src="accr.png" alt=""></div>

    <img class="acc" src="acc.png" alt="acc">
  </div>

  <script>
    const target = document.querySelector('.$');
    const jet = document.querySelector('img.acc');

    // --- Existing disappear interaction ---
    let holdTimer = null;
    let isInteracting = false;

    function startDisappear() {
      if (isInteracting || isDragging) return;
      isInteracting = true;
      jet.classList.add('shrink');
      setTimeout(() => jet.classList.add('disappear'), 1800);
    }
    function resetJet() {
      clearTimeout(holdTimer);
      isInteracting = false;
      jet.classList.remove('shrink', 'disappear');
      jet.style.animation = 'none';
      jet.offsetHeight;
      jet.style.animation = '';
      // Keep current parallax/drag offset
      applyTransform();
    }

    jet.addEventListener('mouseenter', startDisappear);
    jet.addEventListener('mouseleave', resetJet);
    jet.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        holdTimer = setTimeout(startDisappear, 280);
      }
    }, {passive:false});
    jet.addEventListener('touchend', resetJet);
    jet.addEventListener('touchcancel', resetJet);

    // --- Parallax + full drag movement (desktop + mobile) ---
    let isDragging = false;
    let startX = 0, startY = 0;
    let offsetX = 0, offsetY = 0;
    let currentX = 0, currentY = 0;
    let parallaxX = 0, parallaxY = 0;

    function applyTransform() {
      // Combine drag offset + subtle parallax tilt/depth
      const tx = currentX + parallaxX * 0.35;
      const ty = currentY + parallaxY * 0.25;
      const rotY = parallaxX * 0.04;
      const rotX = -parallaxY * 0.03;
      const z = Math.abs(parallaxX) * 0.15;

      if (!jet.classList.contains('shrink') && !jet.classList.contains('disappear')) {
        jet.style.transform = `translate(${tx}px, ${ty}px) translateZ(${z}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      }
    }

    function onPointerDown(e) {
      isDragging = true;
      jet.style.animation = 'none';
      jet.style.transition = 'none';
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX - currentX;
      startY = pt.clientY - currentY;
      e.preventDefault();
    }

    function onPointerMove(e) {
      const pt = e.touches ? e.touches[0] : e;

      // Parallax tracking (always, even when not dragging)
      const rect = jet.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      parallaxX = pt.clientX - cx;
      parallaxY = pt.clientY - cy;

      if (isDragging) {
        currentX = pt.clientX - startX;
        currentY = pt.clientY - startY;
      }
      applyTransform();
    }

    function onPointerUp() {
      isDragging = false;
      jet.style.transition = 'transform 1.8s ease, opacity 2.2s ease';
    }

    // Mouse
    jet.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    // Touch
    jet.addEventListener('touchstart', onPointerDown, {passive:false});
    window.addEventListener('touchmove', onPointerMove, {passive:false});
    window.addEventListener('touchend', onPointerUp);

    // Existing logs
    target.addEventListener('focus', () => console.log('focus → .$'));
    target.addEventListener('mouseenter', () => console.log('rollover → .$'));
    target.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        console.log('activate → .$');
      }
    });
  </script>

</body>
</html>
