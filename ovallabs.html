<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus × Rollover $ Class</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#0f0f0f;font-family:system-ui,sans-serif;color:#e0e0e0;overflow:hidden}
    .${position:relative;display:inline-block;outline:none;border-radius:8px;cursor:pointer;perspective:1200px;transform-style:preserve-3d}
    .$:hover{filter:brightness(1.15);box-shadow:0 0 24px rgba(255,255,255,.15)}
    .$:focus{box-shadow:0 0 0 3px rgba(100,180,255,.6)}

    /* Main image (entire acc.png) */
    .$ > img.acc{
      max-width:90vw;max-height:80vh;display:block;border-radius:8px;
      transform-origin:center center;
      transform-style:preserve-3d;
      cursor:grab;
      touch-action:none;
      user-select:none;
      will-change:transform;
      transition:none; /* JS fully controls transform */
    }
    .$ > img.acc:active{cursor:grabbing}

    /* Disappear states */
    .$ > img.acc.shrink{opacity:1}
    .$ > img.acc.disappear{opacity:0}

    .mod{position:absolute;top:6px;width:64px;height:40px;opacity:.8;pointer-events:none;z-index:1}
    .mod.left{left:6px}
    .mod.right{right:6px}
    .mod svg{width:100%;height:100%}
    .mod .curve{stroke-dasharray:80;stroke-dashoffset:80;animation:draw 2.6s ease-in-out infinite alternate}
    @keyframes draw{to{stroke-dashoffset:0}}

    .venture{
      position:absolute;top:4px;width:180px;height:120px;
      perspective:300px;pointer-events:none;z-index:2;
      filter:blur(1.2px);opacity:.55;
    }
    .venture.left{left:4px}
    .venture.right{right:4px}
    .venture img{
      width:100%;height:100%;object-fit:cover;border-radius:8px;
      transform:rotateY(18deg) rotateX(6deg);
      box-shadow:0 6px 18px rgba(0,0,0,.45);
    }
    .venture.right img{transform:rotateY(-18deg) rotateX(6deg)}
  </style>
</head>
<body>

  <div class="$" tabindex="0" id="acc-target">
    <div class="mod left">
      <svg viewBox="0 0 64 40">
        <line x1="4" y1="36" x2="60" y2="36" stroke="#555" stroke-width="1"/>
        <line x1="4" y1="36" x2="4" y2="4" stroke="#555" stroke-width="1"/>
        <path class="curve" d="M6 20 Q18 8 32 20 T58 20" fill="none" stroke="#7af" stroke-width="1.6"/>
      </svg>
    </div>
    <div class="mod right">
      <svg viewBox="0 0 64 40">
        <line x1="4" y1="36" x2="60" y2="36" stroke="#555" stroke-width="1"/>
        <line x1="4" y1="36" x2="4" y2="4" stroke="#555" stroke-width="1"/>
        <path class="curve" d="M6 20 Q18 32 32 20 T58 20" fill="none" stroke="#7af" stroke-width="1.6"/>
      </svg>
    </div>

    <div class="venture left"><img src="accr.png" alt=""></div>
    <div class="venture right"><img src="accr.png" alt=""></div>

    <img class="acc" src="acc.png" alt="acc" draggable="false">
  </div>

  <script>
    const jet = document.querySelector('img.acc');
    const target = document.querySelector('.$');

    // Position & state
    let x = 0, y = 0;
    let scale = 0.65;          // starts at the post-drop size
    let z = 0;
    let isDragging = false;
    let startX = 0, startY = 0;
    let moveScale = 1;
    let holdTimer = null;
    let isDisappearing = false;

    // Forcefully write the transform (overrides everything)
    function render() {
      jet.style.transform = `
        translate(${x}px, ${y}px)
        scale(${scale * moveScale})
        translateZ(${z}px)
      `;
    }

    // Initial drop animation (runs once)
    let startTime = performance.now();
    function initialDrop(now) {
      const t = Math.min((now - startTime) / 4000, 1);
      const ease = t * t;
      y = -40 * (1 - ease) * (window.innerHeight / 100); // from -40vh
      scale = 1 - 0.35 * ease; // → 0.65
      render();
      if (t < 1) requestAnimationFrame(initialDrop);
      else {
        // gentle forward fly after drop
        requestAnimationFrame(flyLoop);
      }
    }
    requestAnimationFrame(initialDrop);

    let flyDir = 1;
    function flyLoop(now) {
      if (isDragging || isDisappearing) return;
      z += flyDir * 0.8;
      scale = 0.65 + (z / 220) * 0.27;
      if (z > 220) flyDir = -1;
      if (z < 0) flyDir = 1;
      render();
      requestAnimationFrame(flyLoop);
    }

    // ----- Drag / Parallax (works on whole image) -----
    function pointerDown(e) {
      e.preventDefault();
      e.stopPropagation();
      isDragging = true;
      moveScale = 1.35;           // larger while moving
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX - x;
      startY = pt.clientY - y;
      jet.style.cursor = 'grabbing';
      clearTimeout(holdTimer);
    }

    function pointerMove(e) {
      const pt = e.touches ? e.touches[0] : e;
      if (isDragging) {
        x = pt.clientX - startX;
        y = pt.clientY - startY;
        render();
      }
    }

    function pointerUp() {
      isDragging = false;
      moveScale = 1;
      jet.style.cursor = 'grab';
      render();
      if (!isDisappearing) requestAnimationFrame(flyLoop);
    }

    // Mouse
    jet.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);

    // Touch
    jet.addEventListener('touchstart', pointerDown, {passive: false});
    window.addEventListener('touchmove', pointerMove, {passive: false});
    window.addEventListener('touchend', pointerUp);
    window.addEventListener('touchcancel', pointerUp);

    // ----- Hover / hold to shrink & disappear -----
    function startDisappear() {
      if (isDragging || isDisappearing) return;
      isDisappearing = true;
      jet.classList.add('shrink');
      // slow shrink to 30% smaller
      const startScale = scale;
      const start = performance.now();
      function shrinkStep(now) {
        const t = Math.min((now - start) / 1800, 1);
        scale = startScale + (0.70 - startScale) * t;
        render();
        if (t < 1) requestAnimationFrame(shrinkStep);
        else {
          // then drift up & back
          const upStart = performance.now();
          function disappearStep(n) {
            const t2 = Math.min((n - upStart) / 2200, 1);
            y -= 2.2;
            z -= 4;
            scale = 0.70 - 0.15 * t2;
            jet.style.opacity = 1 - t2;
            render();
            if (t2 < 1) requestAnimationFrame(disappearStep);
          }
          requestAnimationFrame(disappearStep);
        }
      }
      requestAnimationFrame(shrinkStep);
    }

    jet.addEventListener('mouseenter', () => {
      holdTimer = setTimeout(startDisappear, 600);
    });
    jet.addEventListener('mouseleave', () => clearTimeout(holdTimer));

    jet.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        holdTimer = setTimeout(startDisappear, 400);
      }
    }, {passive: false});

    // Prevent $ hover scale from fighting the jet
    target.addEventListener('click', e => e.stopPropagation());
  </script>

</body>
</html>
