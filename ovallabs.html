<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus × Rollover $ Class</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#0f0f0f;font-family:system-ui,sans-serif;color:#e0e0e0}
    .${position:relative;display:inline-block;outline:none;transition:transform .25s ease,filter .25s ease,box-shadow .25s ease;border-radius:8px;cursor:pointer}
    .$:hover{transform:scale(1.06);filter:brightness(1.15);box-shadow:0 0 24px rgba(255,255,255,.15)}
    .$:focus{transform:scale(1.04);filter:brightness(1.1);box-shadow:0 0 0 3px rgba(100,180,255,.6)}
    .$:focus:hover{transform:scale(1.08);filter:brightness(1.2)}
    img{max-width:90vw;max-height:80vh;display:block;border-radius:8px}

    /* Identifier blocks – upper corners, child of .$ */
    .mod{position:absolute;top:8px;width:48px;height:28px;opacity:.7;pointer-events:none}
    .mod.left{left:8px}
    .mod.right{right:8px}
    .mod svg{width:100%;height:100%}
  </style>
</head>
<body>

  <div class="$" tabindex="0" id="acc-target">
    <!-- Identifier blocks (curve placeholders – replace with images later) -->
    <div class="mod left">
      <svg viewBox="0 0 48 28"><path d="M2 22 Q12 4 24 14 T46 8" fill="none" stroke="#7af" stroke-width="1.5"/></svg>
    </div>
    <div class="mod right">
      <svg viewBox="0 0 48 28"><path d="M2 8 Q12 24 24 14 T46 22" fill="none" stroke="#7af" stroke-width="1.5"/></svg>
    </div>

    <img src="acc.png" alt="acc">
  </div>

  <script>
    const target=document.querySelector('.$');
    target.addEventListener('focus',()=>console.log('focus → .$'));
    target.addEventListener('mouseenter',()=>console.log('rollover → .$'));
    target.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();console.log('activate → .$')}
    });
  </script>

</body>
</html>
