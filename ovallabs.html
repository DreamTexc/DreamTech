<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus × Rollover Class</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f0f0f;
    font-family:system-ui,sans-serif;
    color:#e0e0e0;
    overflow:hidden;
  }

  .acc-container{
    position:relative;
    display:inline-block;
    border-radius:8px;
    perspective:1200px;
    transform-style:preserve-3d;
  }

  .acc{
    max-width:90vw;
    max-height:80vh;
    display:block;
    border-radius:8px;
    cursor:grab;
    user-select:none;
    touch-action:none;
    will-change:transform;
    position:relative;
    z-index:5;
  }
  .acc:active{cursor:grabbing}

  .acc.spinning{
    animation:fullManeuver 2.8s cubic-bezier(0.4,0,0.2,1) forwards;
  }

  @keyframes fullManeuver{
    0%   {transform:translate(var(--x),var(--y)) rotate(var(--base)) rotateX(0) rotateY(0) rotateZ(0) scale(1)}
    25%  {transform:translate(var(--x),var(--y)) rotate(var(--base)) rotateX(25deg) rotateY(180deg) rotateZ(180deg) scale(1.05)}
    50%  {transform:translate(var(--x),var(--y)) rotate(var(--base)) rotateX(-15deg) rotateY(360deg) rotateZ(360deg) scale(1.1)}
    75%  {transform:translate(var(--x),var(--y)) rotate(var(--base)) rotateX(20deg) rotateY(540deg) rotateZ(540deg) scale(1.05)}
    100% {transform:translate(var(--x),var(--y)) rotate(var(--base)) rotateX(0) rotateY(720deg) rotateZ(720deg) scale(1)}
  }

  .mod{
    position:absolute;
    top:6px;
    width:64px;
    height:40px;
    opacity:.7;
    pointer-events:none;
    z-index:1;
  }
  .mod.left{left:6px}
  .mod.right{right:6px}
  .mod svg{width:100%;height:100%}
  .curve{
    stroke-dasharray:80;
    animation:draw 2.6s ease-in-out infinite alternate;
  }
  @keyframes draw{to{stroke-dashoffset:0}}

  .venture{
    position:absolute;
    top:4px;
    width:180px;
    height:120px;
    perspective:300px;
    pointer-events:none;
    z-index:2;
    filter:blur(1.2px);
    opacity:.55;
  }
  .venture.left{left:4px}
  .venture.right{right:4px}
  .venture img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:8px;
    transform:rotateY(18deg) rotateX(6deg);
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  .venture.right img{transform:rotateY(-18deg) rotateX(6deg)}
</style>
</head>

<body>

<div class="acc-container" id="acc-target">

  <div class="mod left">
    <svg viewBox="0 0 64 40">
      <line x1="4" y1="36" x2="60" y2="36" stroke="#555" stroke-width="1"/>
      <line x1="4" y1="36" x2="4" y2="4" stroke="#555" stroke-width="1"/>
      <path class="curve" d="M6 20 Q18 8 32 20 T58 20" fill="none" stroke="#7af" stroke-width="1.6"/>
    </svg>
  </div>

  <div class="mod right">
    <svg viewBox="0 0 64 40">
      <line x1="4" y1="36" x2="60" y2="36" stroke="#555" stroke-width="1"/>
      <line x1="4" y1="36" x2="4" y2="4" stroke="#555" stroke-width="1"/>
      <path class="curve" d="M6 20 Q18 32 32 20 T58 20" fill="none" stroke="#7af" stroke-width="1.6"/>
    </svg>
  </div>

  <div class="venture left"><img src="accr.png"></div>
  <div class="venture right"><img src="accr.png"></div>

  <img class="acc" src="acc.png" draggable="false">

</div>

<script>
const jet = document.querySelector('.acc');

let dragging = false;
let spinning = false;
let x = 0, y = 0;
let startX = 0, startY = 0;
let base = 0;

// Update transform
function applyTransform(){
  if(spinning) return;
  jet.style.transform = `translate(${x}px,${y}px) rotate(${base}deg)`;
  jet.style.setProperty('--x', x + 'px');
  jet.style.setProperty('--y', y + 'px');
  jet.style.setProperty('--base', base + 'deg');
}

// Drag start
function startDrag(e){
  if(spinning) return;
  dragging = true;
  const pt = e.touches ? e.touches[0] : e;
  startX = pt.clientX - x;
  startY = pt.clientY - y;
  e.preventDefault();
}

// Drag move
function duringDrag(e){
  if(!dragging || spinning) return;
  const pt = e.touches ? e.touches[0] : e;
  x = pt.clientX - startX;
  y = pt.clientY - startY;
  applyTransform();
  e.preventDefault();
}

// Drag end
function endDrag(){
  dragging = false;
}

// Determine left/right side
function getSide(clientX){
  const rect = jet.getBoundingClientRect();
  return clientX < rect.left + rect.width/2 ? 'left' : 'right';
}

// Spin trigger
function triggerSpin(side){
  if(spinning) return;
  spinning = true;
  dragging = false;

  const delta = side === 'left' ? -90 : 90;

  jet.classList.add('spinning');

  setTimeout(()=>{
    jet.classList.remove('spinning');

    // Reset animation cleanly
    jet.style.animation = 'none';
    void jet.offsetWidth;
    jet.style.animation = '';

    base += delta;
    applyTransform();

    spinning = false;
  }, 2850);
}

// Desktop double-click
jet.addEventListener('dblclick', e => {
  triggerSpin(getSide(e.clientX));
});

// Mobile double-tap
let lastTap = 0;
jet.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTap < 300){
    const x = e.changedTouches[0].clientX;
    triggerSpin(getSide(x));
  }
  lastTap = now;
});

// Drag listeners
jet.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', duringDrag);
window.addEventListener('mouseup', endDrag);

jet.addEventListener('touchstart', startDrag, {passive:false});
window.addEventListener('touchmove', duringDrag, {passive:false});
window.addEventListener('touchend', endDrag);

jet.addEventListener('dragstart', e => e.preventDefault());

applyTransform();
</script>

</body>
</html>
