<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculus Manuscript – Ellipse</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { font-size: 1.4em; }
    canvas { border: 1px solid #ccc; background: white; display: block; margin-top: 10px; cursor: crosshair; touch-action: manipulation; }
    .eq { font-size: 1.2em; margin: 10px 0; font-family: serif; }
    #menu {
      position: absolute; display: none; background: #fff; border: 1px solid #aaa;
      border-radius: 4px; box-shadow: 2px 2px 6px rgba(0,0,0,.2); z-index: 10; padding: 4px 0;
    }
    #menu div { padding: 6px 16px; cursor: pointer; }
    #menu div:hover { background: #eef; }
    #cookies { margin-top: 12px; }
    .cookie {
      display: inline-block; margin: 4px; padding: 6px 10px; background: #f4d03f;
      border: 1px solid #d4ac0d; border-radius: 12px; cursor: pointer; font-size: 13px;
    }
    .cookie:hover { background: #f7dc6f; }
    #controls { margin: 10px 0; }
    #controls input[type=file] { margin-right: 8px; }
    #floatBack {
      position: fixed; bottom: 16px; right: 16px; background: #2980b9; color: white;
      padding: 10px 14px; border-radius: 20px; cursor: pointer; font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 20;
    }
  </style>
</head>
<body>
  <h1>Calculus Manuscript</h1>
  <div class="eq">(x − 1)² / 4 + (y − 2)² / 9 = 1</div>

  <div id="controls">
    <label>Photo at center (local only): 
      <input type="file" id="photoInput" accept="image/*">
    </label>
    <span style="color:#666;font-size:13px;"> or paste image (Ctrl+V / long-press paste)</span>
  </div>

  <canvas id="graph" width="500" height="400"></canvas>
  <div id="menu">
    <div data-speed="0.4">PHP Speed: Slow</div>
    <div data-speed="1.0">PHP Speed: Medium</div>
    <div data-speed="2.2">PHP Speed: Fast</div>
    <div data-speed="3.5">PHP Speed: Extreme</div>
  </div>
  <div id="cookies"></div>

  <div id="floatBack" title="Jump back to graph">↑ Graph</div>

  <script>
    const canvas = document.getElementById("graph");
    const ctx = canvas.getContext("2d");
    const menu = document.getElementById("menu");
    const cookiesDiv = document.getElementById("cookies");
    const photoInput = document.getElementById("photoInput");
    const w = canvas.width, h = canvas.height;
    const scale = 40;
    const originX = w / 2 - 1 * scale;
    const originY = h / 2 + 2 * scale;

    let shakeSpeed = 0;
    let animId = null;
    let phase = 0;
    let centerImage = null;
    let lastTap = 0;

    function toCanvas(x, y) {
      return { x: originX + x * scale, y: originY - y * scale };
    }

    function draw(shake = 0) {
      ctx.clearRect(0, 0, w, h);

      // grid
      ctx.strokeStyle = "#eee";
      ctx.lineWidth = 1;
      for (let i = -8; i <= 8; i++) {
        const px = toCanvas(i, 0).x;
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
        const py = toCanvas(0, i).y;
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
      }

      // axes
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1.5;
      const ox = toCanvas(0, 0).x, oy = toCanvas(0, 0).y;
      ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();

      // shaking ellipse
      ctx.strokeStyle = "#c0392b";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let t = 0; t <= 2 * Math.PI; t += 0.015) {
        const s = 1 + shake * Math.sin(t * 8 + phase) * 0.08;
        const x = 1 + 2 * Math.cos(t) * s;
        const y = 2 + 3 * Math.sin(t) * s;
        const p = toCanvas(x, y);
        if (t === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();

      // center marker or image
      const c = toCanvas(1, 2);
      if (centerImage) {
        const size = 70;
        ctx.save();
        ctx.beginPath();
        ctx.arc(c.x, c.y, size / 2, 0, 2 * Math.PI);
        ctx.clip();
        ctx.drawImage(centerImage, c.x - size/2, c.y - size/2, size, size);
        ctx.restore();
        ctx.strokeStyle = "#2980b9";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(c.x, c.y, size/2, 0, 2 * Math.PI);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#2980b9";
        ctx.beginPath();
        ctx.arc(c.x, c.y, 4, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    function animate() {
      phase += shakeSpeed * 0.15;
      draw(shakeSpeed);
      animId = requestAnimationFrame(animate);
    }

    function startShake(speed) {
      shakeSpeed = speed;
      if (animId) cancelAnimationFrame(animId);
      animate();
      spawnCookies();
    }

    function spawnCookies() {
      cookiesDiv.innerHTML = "<strong>Cookies (clickable):</strong><br>";
      for (let i = 0; i < 5; i++) {
        const t = Math.random() * 2 * Math.PI;
        const noise = (Math.random() - 0.5) * 0.6;
        const x = +(1 + 2 * Math.cos(t) + noise).toFixed(1);
        const y = +(2 + 3 * Math.sin(t) + noise).toFixed(1);
        const el = document.createElement("span");
        el.className = "cookie";
        el.textContent = `${x},${y}`;
        el.title = "PHP cookie event";
        el.onclick = () => alert(`Cookie clicked: (${x}, ${y})\n(will do more later)`);
        cookiesDiv.appendChild(el);
      }
    }

    function showMenu(x, y) {
      menu.style.left = x + "px";
      menu.style.top = y + "px";
      menu.style.display = "block";
    }

    // desktop right-click
    canvas.addEventListener("contextmenu", e => {
      e.preventDefault();
      showMenu(e.pageX, e.pageY);
    });

    // mobile double-tap
    canvas.addEventListener("touchend", e => {
      const now = Date.now();
      if (now - lastTap < 350) {
        e.preventDefault();
        const touch = e.changedTouches[0];
        showMenu(touch.pageX, touch.pageY);
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });

    menu.addEventListener("click", e => {
      const speed = e.target.dataset.speed;
      if (speed) {
        startShake(parseFloat(speed));
        menu.style.display = "none";
      }
    });

    document.addEventListener("click", () => menu.style.display = "none");
    document.addEventListener("touchstart", () => menu.style.display = "none");

    // photo: file input (local only)
    photoInput.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith("image/")) return;
      const img = new Image();
      img.onload = () => {
        centerImage = img;
        if (animId) draw(shakeSpeed);
        else draw(0);
      };
      img.src = URL.createObjectURL(file);
    });

    // photo: paste (local only)
    document.addEventListener("paste", e => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (!file) continue;
          const img = new Image();
          img.onload = () => {
            centerImage = img;
            if (animId) draw(shakeSpeed);
            else draw(0);
          };
          img.src = URL.createObjectURL(file);
          break;
        }
      }
    });

    // floating return button
    document.getElementById("floatBack").onclick = () => {
      canvas.scrollIntoView({ behavior: "smooth", block: "center" });
    };

    draw(0);
  </script>
</body>
</html>
