<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DreamTech</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
    h1 { font-size: 1.4em; margin: 0 0 8px; }
    .eq { font-size: 1.1em; margin: 0 0 12px; font-family: serif; }
    #controls { margin: 8px 0 12px; }
    canvas {
      border: 1px solid #ccc; background: #fff; display: block;
      margin: 8px 0; cursor: crosshair; touch-action: manipulation;
      max-width: 100%;
    }
    #menu {
      position: absolute; display: none; background: #fff; border: 1px solid #aaa;
      border-radius: 4px; box-shadow: 2px 2px 6px rgba(0,0,0,.2); z-index: 100; padding: 4px 0;
    }
    #menu div { padding: 8px 18px; cursor: pointer; }
    #menu div:hover { background: #eef; }
    #cookies { margin: 12px 0; }
    .cookie {
      display: inline-block; margin: 4px; padding: 6px 10px; background: #f4d03f;
      border: 1px solid #d4ac0d; border-radius: 12px; cursor: pointer; font-size: 13px;
    }
    #searchBox { margin: 20px 0; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
    #searchBox input[type=text] { padding: 8px; width: 260px; font-size: 15px; }
    #searchBox button { padding: 8px 14px; font-size: 15px; margin-left: 6px; }
    #imageResults { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 40px; }
    #imageResults img { width: 180px; height: 140px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; }
    #floatBack {
      position: fixed; bottom: 16px; right: 16px; background: #2980b9; color: white;
      padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 200;
    }
    .status { color: #666; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Calculus Manuscript</h1>
  <div class="eq">(x − 1)² / 4 + (y − 2)² / 9 = 1</div>

  <div id="controls">
    <label>Photo (large, local only): 
      <input type="file" id="photoInput" accept="image/*">
    </label>
    <span style="color:#666;font-size:13px;"> — or paste image on the graph (Ctrl+V)</span>
  </div>

  <canvas id="graph" width="640" height="480" tabindex="0"></canvas>

  <div id="menu">
    <div data-speed="0.4">PHP Speed: Slow</div>
    <div data-speed="1.0">PHP Speed: Medium</div>
    <div data-speed="2.2">PHP Speed: Fast</div>
    <div data-speed="3.5">PHP Speed: Extreme</div>
  </div>

  <div id="cookies"></div>

  <div id="searchBox">
    <strong>Image Search</strong> (Wikimedia – pictures only)<br>
    <input type="text" id="query" placeholder="search images...">
    <button id="searchBtn">Search</button>
    <div id="status" class="status"></div>
    <div id="imageResults"></div>
  </div>

  <div id="floatBack" title="Back to graph">↑ Graph</div>

  <script>
    const canvas = document.getElementById("graph");
    const ctx = canvas.getContext("2d");
    const menu = document.getElementById("menu");
    const cookiesDiv = document.getElementById("cookies");
    const photoInput = document.getElementById("photoInput");
    const statusEl = document.getElementById("status");
    const w = canvas.width, h = canvas.height;
    const scale = 36;
    const originX = w / 2 - 1 * scale;
    const originY = h / 2 + 2 * scale;

    let shakeSpeed = 0;
    let animId = null;
    let phase = 0;
    let centerImage = null;
    let lastTap = 0;

    function toCanvas(x, y) {
      return { x: originX + x * scale, y: originY - y * scale };
    }

    function draw(shake = 0) {
      ctx.clearRect(0, 0, w, h);

      if (centerImage) {
        const c = toCanvas(1, 2);
        const imgW = Math.max(w * 1.35, 800);
        const imgH = Math.max(h * 1.35, 600);
        const shakeX = Math.sin(phase * 1.3) * shake * 8;
        const shakeY = Math.cos(phase * 1.7) * shake * 7;
        ctx.drawImage(
          centerImage,
          c.x - imgW / 2 + shakeX,
          c.y - imgH / 2 + shakeY,
          imgW,
          imgH
        );
      } else {
        ctx.fillStyle = "#fafafa";
        ctx.fillRect(0, 0, w, h);
      }

      ctx.strokeStyle = "rgba(0,0,0,0.04)";
      ctx.lineWidth = 1;
      for (let i = -10; i <= 10; i++) {
        const px = toCanvas(i, 0).x;
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
        const py = toCanvas(0, i).y;
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
      }

      ctx.strokeStyle = "rgba(0,0,0,0.1)";
      ctx.lineWidth = 1;
      const ox = toCanvas(0, 0).x, oy = toCanvas(0, 0).y;
      ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();

      // nearly invisible ellipse
      ctx.strokeStyle = "rgba(192,57,43,0.05)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let t = 0; t <= 2 * Math.PI; t += 0.025) {
        const s = 1 + shake * Math.sin(t * 5 + phase) * 0.025;
        const x = 1 + 2 * Math.cos(t) * s;
        const y = 2 + 3 * Math.sin(t) * s;
        const p = toCanvas(x, y);
        if (t === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function animate() {
      phase += shakeSpeed * 0.18;
      draw(shakeSpeed);
      animId = requestAnimationFrame(animate);
    }

    function startShake(speed) {
      shakeSpeed = speed;
      if (animId) cancelAnimationFrame(animId);
      animate();
      spawnCookies();
    }

    function spawnCookies() {
      cookiesDiv.innerHTML = "<strong>Cookies:</strong><br>";
      for (let i = 0; i < 5; i++) {
        const t = Math.random() * 2 * Math.PI;
        const noise = (Math.random() - 0.5) * 0.5;
        const x = +(1 + 2 * Math.cos(t) + noise).toFixed(1);
        const y = +(2 + 3 * Math.sin(t) + noise).toFixed(1);
        const el = document.createElement("span");
        el.className = "cookie";
        el.textContent = `${x},${y}`;
        el.onclick = () => alert(`Cookie: (${x}, ${y})`);
        cookiesDiv.appendChild(el);
      }
    }

    function showMenu(x, y) {
      menu.style.left = x + "px";
      menu.style.top = y + "px";
      menu.style.display = "block";
    }

    canvas.addEventListener("contextmenu", e => {
      e.preventDefault();
      showMenu(e.pageX, e.pageY);
    });

    canvas.addEventListener("touchend", e => {
      const now = Date.now();
      if (now - lastTap < 350) {
        e.preventDefault();
        const touch = e.changedTouches[0];
        showMenu(touch.pageX, touch.pageY);
        lastTap = 0;
      } else lastTap = now;
    });

    menu.addEventListener("click", e => {
      const speed = e.target.dataset.speed;
      if (speed) {
        startShake(parseFloat(speed));
        menu.style.display = "none";
      }
    });

    document.addEventListener("click", () => menu.style.display = "none");
    document.addEventListener("touchstart", () => menu.style.display = "none");

    function setImage(fileOrUrl) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        centerImage = img;
        if (animId) draw(shakeSpeed);
        else draw(0);
      };
      if (typeof fileOrUrl === "string") {
        img.src = fileOrUrl;
      } else {
        if (!fileOrUrl || !fileOrUrl.type.startsWith("image/")) return;
        img.src = URL.createObjectURL(fileOrUrl);
      }
    }

    photoInput.addEventListener("change", e => setImage(e.target.files[0]));

    function handlePaste(e) {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          e.preventDefault();
          setImage(item.getAsFile());
          break;
        }
      }
    }
    canvas.addEventListener("paste", handlePaste);
    document.addEventListener("paste", handlePaste);

    // Working image search via Wikimedia Commons API
    document.getElementById("searchBtn").onclick = doSearch;
    document.getElementById("query").addEventListener("keydown", e => {
      if (e.key === "Enter") doSearch();
    });

    async function doSearch() {
      const q = document.getElementById("query").value.trim();
      if (!q) return;
      const results = document.getElementById("imageResults");
      results.innerHTML = "";
      statusEl.textContent = "Searching…";

      try {
        const url = `https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=10&gsrnamespace=6&iiprop=url&iiurlwidth=300&origin=*`;
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query?.pages || {};
        let count = 0;

        for (const page of Object.values(pages)) {
          const info = page.imageinfo?.[0];
          if (!info?.thumburl && !info?.url) continue;
          const img = document.createElement("img");
          img.src = info.thumburl || info.url;
          img.alt = page.title || q;
          img.title = "Click to place on graph";
          img.onclick = () => {
            setImage(info.url || info.thumburl);
            canvas.scrollIntoView({ behavior: "smooth", block: "center" });
          };
          results.appendChild(img);
          count++;
        }
        statusEl.textContent = count ? `${count} images found` : "No images found";
      } catch (err) {
        statusEl.textContent = "Search failed (network or API limit)";
        console.error(err);
      }
    }

    document.getElementById("floatBack").onclick = () => {
      canvas.scrollIntoView({ behavior: "smooth", block: "center" });
    };

    draw(0);
  </script>
</body>
</html>
