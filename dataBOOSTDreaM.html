<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XML to Table</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }

        /* NORMAL Load Table Button */
        #loadTable {
            background: #e0e0e0;
            color: black;
            border: 1px solid #999;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #loadTable:hover {
            background: #d0d0d0;
        }

        /* Dreamlike Reveal Animation */
        .dream-reveal {
            opacity: 0;
            transform: translateY(20px);
            filter: blur(6px);
            transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
        }

        .dream-reveal.active {
            opacity: 1;
            transform: translateY(0px);
            filter: blur(0px);
        }

        /* Floating Dream Particles */
        .dream-particles {
            position: relative;
        }

        .dream-particles::before,
        .dream-particles::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            animation: drift 4s infinite ease-in-out;
        }

        .dream-particles::after {
            width: 4px;
            height: 4px;
            animation-duration: 5.5s;
            background: rgba(0,212,255,0.8);
        }

        @keyframes drift {
            0% { transform: translate(0,0); opacity: 0.8; }
            50% { transform: translate(25px,-20px); opacity: 0.4; }
            100% { transform: translate(-10px,10px); opacity: 0.9; }
        }

        /* DreamTech Circular Image Presentation */
        .dream-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            margin: 25px auto;
            box-shadow: 0 0 25px rgba(111,0,255,0.6);
            transform: scale(0.8);
            opacity: 0;
            filter: blur(8px);
            transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;

            /* Centering system */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dream-circle.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
        }

        .dream-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ensures perfect centering */
        }
    </style>

    <script defer>
        /* DreamTech Wrapper System */
        class SelectionWrapper {
            constructor() {
                this.lastSelection = "";
            }
            update() {
                const sel = document.getSelection().toString().trim();
                if (sel && sel !== this.lastSelection) {
                    this.lastSelection = sel;
                    this.onSelection(sel);
                }
            }
            onSelection(text) {
                console.log("Wrapper received:", text);
            }
        }

        const wrapper = new SelectionWrapper();

        document.addEventListener("selectionchange", () => {
            const sel = document.getSelection().toString().trim();
            const out = document.getElementById("selectionOutput");
            out.textContent = sel ? `Selected: "${sel}"` : "";
            wrapper.update();
        });

        /* DreamTech Specifier System */
        function runSpecifier(cmd) {
            switch (cmd) {
                case "@spawn.polarizer":
                    generatePolarizer();
                    break;
                default:
                    console.warn("Unknown DreamTech specifier:", cmd);
            }
        }

        document.addEventListener("keydown", (event) => {
            if (event.code === "Space") {
                event.preventDefault();
                runSpecifier("@spawn.polarizer");
            }
        });

        function generatePolarizer() {
            const container = document.getElementById("tableContainer");

            const wrap = document.createElement("div");
            wrap.style.margin = "12px 0";

            const label = document.createElement("div");
            label.textContent = "Heliopan Linear Polarizer";

            const img = document.createElement("img");
            img.src = "https://th.bing.com/th/id/OIP.mTCbpFG-xUdGvY777UJUiQHaEK?w=292&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7";
            img.alt = "Heliopan Linear Polarizer";
            img.style.width = "200px";
            img.style.display = "block";
            img.style.marginTop = "6px";

            wrap.appendChild(label);
            wrap.appendChild(img);
            container.appendChild(wrap);
        }

        /* DreamTech Circle Image Loader */
        function loadDreamCircleImage(url) {
            const container = document.getElementById("imageCircleContainer");

            const circle = document.createElement("div");
            circle.className = "dream-circle";

            const img = document.createElement("img");
            img.src = url;
            img.alt = "DreamTech Image";

            circle.appendChild(img);
            container.innerHTML = "";
            container.appendChild(circle);

            setTimeout(() => {
                circle.classList.add("active");
            }, 50);
        }

        /* Load Table + Circle Image */
        document.getElementById("loadTable").addEventListener("click", () => {
            const container = document.getElementById("tableContainer");

            container.classList.add("dream-reveal", "dream-particles");

            setTimeout(() => {
                container.classList.add("active");
            }, 50);

            container.innerHTML = `
                <table>
                    <tr><th>DreamTech</th><th>Value</th></tr>
                    <tr><td>Specifier</td><td>Polarizer</td></tr>
                    <tr><td>Mode</td><td>Dreamlike</td></tr>
                </table>
            `;

            /* Circular image recall */
            loadDreamCircleImage(
                "https://th.bing.com/th/id/OIP.mTCbpFG-xUdGvY777UJUiQHaEK?w=292&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7"
            );
        });
    </script>
</head>

<body>
    <h1>Welcome to DreamTech</h1>

    <div id="selectionOutput"></div>

    <button id="loadTable">Load Table</button>
    <button onclick="window.location.href='jetMathOverlay.html'">Generate Content</button>

    <div id="tableContainer"></div>

    <!-- DreamTech Circle Image Container -->
    <div id="imageCircleContainer"></div>
</body>
</html>
