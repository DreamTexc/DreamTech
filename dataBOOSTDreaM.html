<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XML to Table</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }

        #specifierArea {
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f9f9f9;
        }

        #specifierInput {
            width: 380px;
            padding: 6px 10px;
            font-size: 14px;
            margin-right: 10px;
        }

        #constructorSelect {
            padding: 6px 10px;
            font-size: 14px;
            min-width: 160px;
            display: none;
        }

        .dream-reveal {
            opacity: 0;
            transform: translateY(20px);
            filter: blur(6px);
            transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
        }

        .dream-reveal.active {
            opacity: 1;
            transform: translateY(0px);
            filter: blur(0px);
        }

        .dream-particles {
            position: relative;
        }

        .dream-particles::before,
        .dream-particles::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(200,200,200,0.7);
            border-radius: 50%;
            animation: drift 4s infinite ease-in-out;
        }

        .dream-particles::after {
            width: 4px;
            height: 4px;
            animation-duration: 5.5s;
            background: rgba(230,230,230,0.8);
        }

        @keyframes drift {
            0% { transform: translate(0,0); opacity: 0.8; }
            50% { transform: translate(25px,-20px); opacity: 0.4; }
            100% { transform: translate(-10px,10px); opacity: 0.9; }
        }

        .dream-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            margin: 25px auto;
            box-shadow: 0 0 25px rgba(180,180,180,0.6);
            transform: scale(0.8);
            opacity: 0;
            filter: blur(8px);
            transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .dream-circle.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
        }

        .dream-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transform: translateX(12px);
        }

        /* LATTICE-STYLE BRANCHES (RIGHT SIDE) */
        .dream-limbs {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            width: 90px;
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .limb {
            position: relative;
            width: 90px;
            height: 18px;
            transform-origin: left center;
        }

        .limb::before {
            content: "";
            position: absolute;
            left: 0;
            top: 8px;
            width: 90px;
            height: 3px;
            background: linear-gradient(90deg, #bbb, #888);
            box-shadow: 0 0 4px rgba(180,180,180,0.6);
        }

        .limb .diag1,
        .limb .diag2 {
            position: absolute;
            left: 0;
            width: 90px;
            height: 2px;
            background: #999;
            transform-origin: left center;
        }

        .limb .diag1 {
            top: 3px;
            transform: rotate(12deg);
        }

        .limb .diag2 {
            top: 13px;
            transform: rotate(-12deg);
        }

        .limb .node {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ddd;
            border: 1px solid #aaa;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(200,200,200,0.8);
            top: 4px;
        }

        .limb .node:nth-child(1) { left: -2px; }
        .limb .node:nth-child(2) { left: 38px; }
        .limb .node:nth-child(3) { left: 78px; }

        .limb:nth-child(1) { transform: rotate(18deg); }
        .limb:nth-child(2) { transform: rotate(6deg); }
        .limb:nth-child(3) { transform: rotate(-6deg); }
    </style>
</head>

<body>
    <h1>Welcome to DreamTech</h1>

    <div id="selectionOutput"></div>

    <!-- Specifier Area -->
    <div id="specifierArea">
        <label>Specifier: </label>
        <input type="text" id="specifierInput" placeholder='Type "007" to open constructor list...'>
        <select id="constructorSelect">
            <option value="">-- select constructor --</option>
        </select>
    </div>

    <button id="loadTable">Load Table</button>
    <button onclick="window.location.href='jetMathOverlay.html'">Generate Content</button>

    <div id="tableContainer"></div>
    <div id="imageCircleContainer"></div>

    <script>
        class SelectionWrapper {
            constructor() {
                this.lastSelection = "";
            }
            update() {
                const sel = document.getSelection().toString().trim();
                if (sel && sel !== this.lastSelection) {
                    this.lastSelection = sel;
                    this.onSelection(sel);
                }
            }
            onSelection(text) {
                console.log("Wrapper received:", text);
            }
        }

        const wrapper = new SelectionWrapper();

        document.addEventListener("selectionchange", () => {
            const sel = document.getSelection().toString().trim();
            const out = document.getElementById("selectionOutput");
            out.textContent = sel ? `Selected: "${sel}"` : "";
            wrapper.update();
        });

        /* Specifier input – type 007 to open the list */
        document.getElementById("specifierInput").addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                const cmd = this.value.trim();

                if (cmd === "007") {
                    // Anonymous function that builds the constructor list
                    (function createConstructorList() {
                        const select = document.getElementById("constructorSelect");

                        while (select.options.length > 1) {
                            select.remove(1);
                        }

                        const constructors = [
                            "007",
                            "Batman",
                            "Iron Man",
                            "He-Man",
                            "Superwoman",
                            "Superman",
                            "Spider-Man",
                            "Wonder Woman",
                            "Captain America",
                            "Hulk",
                            "Thor",
                            "Wolverine",
                            "The Flash",
                            "Green Lantern",
                            "Black Panther",
                            "Aquaman",
                            "Doctor Strange",
                            "Black Widow"
                        ];

                        constructors.forEach(name => {
                            const opt = document.createElement("option");
                            opt.value = name;
                            opt.textContent = name;
                            select.appendChild(opt);
                        });

                        select.style.display = "inline-block";

                        select.onchange = function () {
                            const chosen = this.value;
                            if (chosen) {
                                console.log("Constructor function selected:", chosen);
                            }
                        };
                    })();

                    this.value = "";
                    return;
                }

                if (cmd) {
                    runSpecifier(cmd);
                    this.value = "";
                }
            }
        });

        function runSpecifier(cmd) {
            switch (cmd) {
                case "@spawn.polarizer":
                    generatePolarizer();
                    break;
                default:
                    console.log("Specifier / constructor received:", cmd);
            }
        }

        document.addEventListener("keydown", (event) => {
            if (event.code === "Space" && document.activeElement.id !== "specifierInput") {
                event.preventDefault();
                runSpecifier("@spawn.polarizer");
            }
        });

        function generatePolarizer() {
            const container = document.getElementById("tableContainer");

            const wrap = document.createElement("div");
            wrap.style.margin = "12px 0";

            const label = document.createElement("div");
            label.textContent = "Heliopan Linear Polarizer";

            const img = document.createElement("img");
            img.src = "https://th.bing.com/th/id/OIP.mTCbpFG-xUdGvY777UJUiQHaEK?w=292&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7";
            img.alt = "Heliopan Linear Polarizer";
            img.style.width = "200px";
            img.style.display = "block";
            img.style.marginTop = "6px";

            wrap.appendChild(label);
            wrap.appendChild(img);
            container.appendChild(wrap);
        }

        function loadDreamCircleImage(url) {
            const container = document.getElementById("imageCircleContainer");

            const circle = document.createElement("div");
            circle.className = "dream-circle";

            const limbs = document.createElement("div");
            limbs.className = "dream-limbs";

            for (let i = 0; i < 3; i++) {
                const limb = document.createElement("div");
                limb.className = "limb";

                for (let n = 0; n < 3; n++) {
                    const node = document.createElement("div");
                    node.className = "node";
                    limb.appendChild(node);
                }

                const diag1 = document.createElement("div");
                diag1.className = "diag1";
                const diag2 = document.createElement("div");
                diag2.className = "diag2";

                limb.appendChild(diag1);
                limb.appendChild(diag2);
                limbs.appendChild(limb);
            }

            const img = document.createElement("img");
            img.src = url;
            img.alt = "DreamTech Image";

            circle.appendChild(img);
            circle.appendChild(limbs);

            container.innerHTML = "";
            container.appendChild(circle);

            setTimeout(() => {
                circle.classList.add("active");
            }, 50);
        }

        document.getElementById("loadTable").addEventListener("click", () => {
            const container = document.getElementById("tableContainer");

            container.classList.add("dream-reveal", "dream-particles");

            setTimeout(() => {
                container.classList.add("active");
            }, 50);

            // ORIGINAL TABLE – unchanged
            container.innerHTML = `
                <table>
                    <tr><th>DreamTech</th><th>Value</th></tr>
                    <tr><td>Specifier</td><td>Polarizer</td></tr>
                    <tr><td>Mode</td><td>Dreamlike</td></tr>
                </table>
            `;

            loadDreamCircleImage(
                "https://th.bing.com/th/id/OIP.mTCbpFG-xUdGvY777UJUiQHaEK?w=292&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7"
            );
        });
    </script>
</body>
</html>
